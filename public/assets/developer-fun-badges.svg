<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Badge 1: Works On My Machine -->
  <g transform="translate(15, 15)">
    <rect width="215" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <!-- Laptop Icon SVG -->
    <rect x="14" y="22" width="22" height="15" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.8" />
    <path d="M10 37 L40 37" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#e6edf3">Works On My Machine™</text>
    <text x="46" y="47" font-family="-apple-system, sans-serif" font-size="9.5" fill="#7ee787">100% Guaranteed locally</text>
  </g>

  <!-- Badge 2: Coffee to Code Converter -->
  <g transform="translate(250, 15)">
    <rect width="215" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <!-- Coffee Cup SVG -->
    <path d="M15 24 L33 24 L31 37 C31 39 29 41 24 41 C19 41 17 39 17 37 Z" fill="none" stroke="#f0883e" stroke-width="1.8" />
    <path d="M33 27 C36 27 38 29 38 32 C38 35 36 37 33 37" fill="none" stroke="#f0883e" stroke-width="1.5" />
    <text x="46" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#e6edf3">Coffee ➔ Code Engine</text>
    <text x="46" y="47" font-family="-apple-system, sans-serif" font-size="9.5" fill="#d29922">99.8% Caffeine Efficiency</text>
  </g>

  <!-- Badge 3: Git Commit Debugger -->
  <g transform="translate(485, 15)">
    <rect width="225" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <!-- Git Branch / Bug SVG -->
    <circle cx="24" cy="26" r="3" fill="#a371f7" />
    <circle cx="34" cy="38" r="3" fill="#a371f7" />
    <path d="M24 29 L24 42 M24 35 L34 38" stroke="#a371f7" stroke-width="1.8" stroke-linecap="round" />
    <text x="46" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#e6edf3">git commit -m "Fixed Bug"</text>
    <text x="46" y="47" font-family="-apple-system, sans-serif" font-size="9.5" fill="#bc8cff">(Created 2 new bugs)</text>
  </g>

  <!-- Badge 4: Production Friday Deployer -->
  <g transform="translate(730, 15)">
    <rect width="215" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <!-- Caution Shield SVG -->
    <path d="M25 20 L35 24 L35 34 C35 40 25 44 25 44 C25 44 15 40 15 34 L15 24 Z" fill="none" stroke="#f85149" stroke-width="1.8" />
    <path d="M25 26 L25 32 M25 36 L25 37" stroke="#f85149" stroke-width="2" stroke-linecap="round" />
    <text x="44" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#e6edf3">Friday 5 PM Deployer</text>
    <text x="44" y="47" font-family="-apple-system, sans-serif" font-size="9.5" fill="#ff7b72">Living on the Edge</text>
  </g>
</svg>
