<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="unicornBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="rainbowMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      *, .typing-paw, .unicorn-bounce, .heart-float {
        animation: none !important;
      }
    }
    .unicorn-bounce {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: gentleFloat 3s ease-in-out infinite alternate;
    }
    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }
    .typing-paw {
      transform-box: fill-box;
      transform-origin: top center;
      animation: pawType 0.4s ease-in-out infinite alternate;
    }
    .typing-paw-right {
      animation-delay: 0.2s;
    }
    @keyframes pawType {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    .heart-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: heartRise 2.4s ease-out infinite;
    }
    @keyframes heartRise {
      0% { transform: scale(0.4) translateY(0); opacity: 0; }
      40% { opacity: 0.9; }
      100% { transform: scale(1.1) translateY(-40px); opacity: 0; }
    }
  </style>

  <!-- FLOATING HEARTS & CODE SPARKS -->
  <g>
    <path class="heart-float" d="M140 120 C130 105 105 110 115 130 C125 145 140 155 140 155 C140 155 155 145 165 130 C175 110 150 105 140 120 Z" fill="#F43F5E" style="animation-delay: 0.2s;"/>
    <path class="heart-float" d="M290 140 C282 128 262 132 270 148 C278 160 290 168 290 168 C290 168 302 160 310 148 C318 132 298 128 290 140 Z" fill="#A855F7" style="animation-delay: 1.1s;"/>
    <circle class="heart-float" cx="280" cy="110" r="4" fill="#38BDF8" style="animation-delay: 0.6s;"/>
    <circle class="heart-float" cx="130" cy="90" r="3.5" fill="#FBBF24" style="animation-delay: 1.4s;"/>
  </g>

  <!-- UNICORN MAIN BODY -->
  <g class="unicorn-bounce" filter="url(#softShadow)">
    <!-- Fluffy Rainbow Tail -->
    <path d="M120 290 C80 270 60 320 85 345 C110 365 130 315 120 290 Z" fill="url(#rainbowMane)"/>

    <!-- Unicorn Plump Body -->
    <ellipse cx="210" cy="285" rx="85" ry="75" fill="url(#unicornBody)"/>

    <!-- Hind Legs / Cute Paws Sitting -->
    <ellipse cx="140" cy="335" rx="28" ry="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <ellipse cx="270" cy="335" rx="28" ry="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Cute hoof pads (pink) -->
    <ellipse cx="138" cy="335" rx="14" ry="9" fill="#F472B6"/>
    <ellipse cx="272" cy="335" rx="14" ry="9" fill="#F472B6"/>

    <!-- Unicorn Head & Snout -->
    <circle cx="215" cy="180" r="62" fill="url(#unicornBody)"/>
    <!-- Cute Chubby Cheeks -->
    <ellipse cx="170" cy="200" rx="14" ry="8" fill="#FDA4AF" opacity="0.7"/>
    <ellipse cx="260" cy="200" rx="14" ry="8" fill="#FDA4AF" opacity="0.7"/>

    <!-- Unicorn Ears -->
    <path d="M165 140 C155 105 175 110 185 130 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M170 135 C164 115 174 118 180 130 Z" fill="#F472B6"/>
    <path d="M265 140 C275 105 255 110 245 130 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M260 135 C266 115 256 118 250 130 Z" fill="#F472B6"/>

    <!-- Golden Twisted Horn -->
    <polygon points="215,75 204,130 226,130" fill="url(#goldHorn)"/>
    <path d="M207 115 L223 118 M209 100 L221 103 M212 88 L218 90" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Flowing Rainbow Forelock Mane -->
    <path d="M190 125 C175 140 180 170 195 160 C210 150 205 130 190 125 Z" fill="#EC4899"/>
    <path d="M225 125 C245 140 235 170 220 160 C210 150 215 130 225 125 Z" fill="#8B5CF6"/>
    <path d="M198 135 C205 155 215 155 218 135 Z" fill="#38BDF8"/>

    <!-- Big Happy Anime Eyes -->
    <ellipse cx="190" cy="180" rx="10" ry="14" fill="#1E293B"/>
    <ellipse cx="240" cy="180" rx="10" ry="14" fill="#1E293B"/>
    <!-- Eye Sparkle Highlights -->
    <circle cx="187" cy="176" r="4.5" fill="#FFFFFF"/>
    <circle cx="193" cy="184" r="2" fill="#FFFFFF"/>
    <circle cx="237" cy="176" r="4.5" fill="#FFFFFF"/>
    <circle cx="243" cy="184" r="2" fill="#FFFFFF"/>

    <!-- Cute Smiling Mouth with Playful Tongue -->
    <path d="M208 198 Q215 204 222 198" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M211 200 Q215 210 219 200 Z" fill="#F43F5E"/>

    <!-- DEVELOPER LAPTOP ON DESK -->
    <g transform="translate(145, 255)">
      <!-- Laptop Screen Back (Facing Away or Angled) -->
      <polygon points="15,40 25,0 85,0 95,40" fill="url(#laptopGrad)"/>
      <polygon points="18,37 27,4 83,4 92,37" fill="#0F172A"/>
      <!-- Glowing Apple / Dev Logo on Screen -->
      <circle cx="55" cy="20" r="7" fill="#38BDF8" opacity="0.9"/>
      <path d="M57 13 Q60 11 58 8" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
      <!-- Laptop Keyboard Base -->
      <polygon points="0,48 15,40 95,40 110,48" fill="#CBD5E1"/>
      <polygon points="5,46 17,42 93,42 105,46" fill="#94A3B8"/>
    </g>

    <!-- Typing Paws (Active typing on keyboard) -->
    <g class="typing-paw">
      <ellipse cx="180" cy="272" rx="14" ry="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <ellipse cx="180" cy="272" rx="6" ry="4" fill="#F472B6"/>
    </g>
    <g class="typing-paw typing-paw-right">
      <ellipse cx="235" cy="272" rx="14" ry="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <ellipse cx="235" cy="272" rx="6" ry="4" fill="#F472B6"/>
    </g>
  </g>
</svg>