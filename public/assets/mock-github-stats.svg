<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="495" height="195" rx="10" fill="url(#statBg)" stroke="#30363d" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(25, 30)">
    <path d="M0 -5 L14 -5 L7 8 Z" fill="#38bdf8" />
    <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" fill="#58a6ff">
      Developer GitHub Stats
    </text>
    <text x="320" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7d8590">
      (Mock Preview)
    </text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(25, 55)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    <!-- Total Stars -->
    <g transform="translate(0, 18)">
      <path d="M6 0 L8 4 L12 4 L9 7 L10 11 L6 8 L2 11 L3 7 L0 4 L4 4 Z" fill="#e3b341" />
      <text x="22" y="9" fill="#c9d1d9">Total Stars Earned:</text>
      <text x="210" y="9" font-weight="700" fill="#ffffff" font-family="'Fira Code', monospace">1,420</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 42)">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#3fb950" stroke-width="2" />
      <path d="M0 6 L2 6 M10 6 L12 6" stroke="#3fb950" stroke-width="2" />
      <text x="22" y="9" fill="#c9d1d9">Total Commits (2026):</text>
      <text x="210" y="9" font-weight="700" fill="#ffffff" font-family="'Fira Code', monospace">2,840</text>
    </g>

    <!-- Total PRs -->
    <g transform="translate(0, 66)">
      <circle cx="4" cy="3" r="2.5" fill="#a371f7" />
      <circle cx="4" cy="11" r="2.5" fill="#a371f7" />
      <circle cx="10" cy="7" r="2.5" fill="#a371f7" />
      <path d="M4 5.5 L4 8.5 M10 7 L7 7" stroke="#a371f7" stroke-width="1.5" />
      <text x="22" y="9" fill="#c9d1d9">Total PRs Merged:</text>
      <text x="210" y="9" font-weight="700" fill="#ffffff" font-family="'Fira Code', monospace">184</text>
    </g>

    <!-- Total Issues -->
    <g transform="translate(0, 90)">
      <circle cx="6" cy="6" r="5" fill="none" stroke="#f85149" stroke-width="2" />
      <circle cx="6" cy="6" r="1.5" fill="#f85149" />
      <text x="22" y="9" fill="#c9d1d9">Issues Solved:</text>
      <text x="210" y="9" font-weight="700" fill="#ffffff" font-family="'Fira Code', monospace">42</text>
    </g>

    <!-- Contributed Repos -->
    <g transform="translate(0, 114)">
      <rect x="1" y="2" width="10" height="8" rx="1.5" fill="none" stroke="#58a6ff" stroke-width="1.8" />
      <text x="22" y="9" fill="#c9d1d9">Contributed to:</text>
      <text x="210" y="9" font-weight="700" fill="#ffffff" font-family="'Fira Code', monospace">38 repositories</text>
    </g>
  </g>

  <!-- Rank Grade Ring -->
  <g transform="translate(390, 105)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#21262d" stroke-width="6" />
    <!-- Progress Arc -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="282" stroke-dashoffset="35" stroke-linecap="round" filter="url(#ringGlow)" transform="rotate(-90)" />
    <!-- Letter Grade -->
    <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">
      A+
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#7d8590" text-anchor="middle">
      GLOBAL RANK
    </text>
  </g>
</svg>
