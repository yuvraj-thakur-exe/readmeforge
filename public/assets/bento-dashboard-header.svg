<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="animeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="purpleSpark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      *, .pulse-signal, .twinkle-star {
        animation: none !important;
      }
    }
    .pulse-signal {
      animation: signalPulse 2.8s ease-in-out infinite alternate;
    }
    @keyframes signalPulse {
      0% { opacity: 0.8; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #38BDF8); }
    }
    .twinkle-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: starShine 3s ease-in-out infinite alternate;
    }
    @keyframes starShine {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- BENTO DASHBOARD CONTAINER -->
  <rect x="0" y="0" width="840" height="280" rx="14" fill="url(#bentoBg)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- TOP MACOS CONTROL BAR -->
  <g transform="translate(18, 14)">
    <circle cx="8" cy="8" r="5" fill="#EF4444"/>
    <circle cx="24" cy="8" r="5" fill="#F59E0B"/>
    <circle cx="40" cy="8" r="5" fill="#10B981"/>

    <!-- Breadcrumb -->
    <text x="64" y="12" fill="#64748B" font-family="monospace" font-size="11">yourname / README.md</text>

    <!-- Preview Badge -->
    <rect x="740" y="-1" width="64" height="18" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="772" y="12" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Preview</text>
  </g>
  <line x1="0" y1="38" x2="840" y2="38" stroke="#1F2937" stroke-width="1"/>

  <!-- TOP BENTO HERO CARD -->
  <g transform="translate(18, 48)">
    <rect x="0" y="0" width="804" height="114" rx="10" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>

    <!-- Left Vertical Social Sidebar -->
    <g transform="translate(16, 12)">
      <!-- GitHub icon -->
      <circle cx="10" cy="10" r="10" fill="#111827"/>
      <circle cx="10" cy="10" r="4" fill="#94A3B8"/>
      <!-- Twitter/X -->
      <circle cx="10" cy="34" r="10" fill="#111827"/>
      <path d="M7 31 L13 37 M13 31 L7 37" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Mail -->
      <circle cx="10" cy="58" r="10" fill="#111827"/>
      <rect x="6" y="55" width="8" height="6" rx="1" fill="none" stroke="#94A3B8" stroke-width="1"/>
      <!-- Link -->
      <circle cx="10" cy="82" r="10" fill="#111827"/>
      <path d="M7 82 L13 82" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <line x1="44" y1="8" x2="44" y2="106" stroke="#1E293B" stroke-width="1"/>

    <!-- Anime / Cyber Silhouette Banner Art -->
    <g transform="translate(56, 10)">
      <rect x="0" y="0" width="160" height="94" rx="8" fill="url(#animeSky)"/>
      <!-- Stars in night sky -->
      <circle class="twinkle-star" cx="20" cy="15" r="1.5" fill="#FFFFFF"/>
      <circle class="twinkle-star" cx="130" cy="22" r="1.5" fill="#FFFFFF" style="animation-delay: 0.7s;"/>
      <circle class="twinkle-star" cx="80" cy="12" r="1" fill="#38BDF8" style="animation-delay: 1.4s;"/>
      <circle class="twinkle-star" cx="100" cy="35" r="1.2" fill="#FFFFFF" style="animation-delay: 2.1s;"/>
      <!-- Mountain ridges & pine tree silhouettes -->
      <polygon points="0,94 30,65 75,94" fill="#0B1329"/>
      <polygon points="50,94 110,55 160,94" fill="#070D1F"/>
      <!-- Silhouette of Developer in Hoodie gazing at stars -->
      <ellipse cx="80" cy="62" rx="14" ry="16" fill="#030712"/>
      <path d="M60 94 C65 78 72 74 80 74 C88 74 95 78 100 94 Z" fill="#030712"/>
    </g>

    <!-- Bio & Tag Pills on Right -->
    <g transform="translate(232, 16)">
      <text x="0" y="14" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">@ Hey, I'm</text>
      <text x="0" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">A developer who builds in public.</text>
      <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">I like turning ideas into useful software, learning in public, and collaborating with great people.</text>

      <!-- Tag Pills -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="76" height="20" rx="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="38" y="14" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Developer</text>

        <rect x="84" y="0" width="88" height="20" rx="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="128" y="14" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Open-Source</text>

        <rect x="180" y="0" width="68" height="20" rx="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="214" y="14" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Building</text>

        <rect x="256" y="0" width="72" height="20" rx="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="292" y="14" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Learning</text>

        <rect x="336" y="0" width="68" height="20" rx="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="370" y="14" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Shipping</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM ROW: PROFILE SIGNAL LIVE METRICS -->
  <g transform="translate(18, 172)">
    <!-- Header Subtitle -->
    <text x="4" y="12" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">Profile Signal</text>
    <text x="100" y="12" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Live GitHub stats styled as widgets</text>

    <!-- 4 BENTO METRIC WIDGETS -->
    <g transform="translate(0, 22)">
      <!-- Card 1: Stars -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="192" height="68" rx="8" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
        <polygon points="18,16 20,22 26,22 21,26 23,32 18,28 13,32 15,26 10,22 16,22" fill="#34D399"/>
        <text x="32" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Stars</text>
        <text x="18" y="52" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="800">261K</text>
        <!-- Sparkline -->
        <path class="pulse-signal" d="M110 46 L130 36 L150 42 L175 28" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Card 2: Contributions -->
      <g transform="translate(204, 0)">
        <rect x="0" y="0" width="192" height="68" rx="8" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
        <polygon points="18,14 12,25 17,25 14,34 22,23 17,23" fill="#A855F7"/>
        <text x="28" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Contributions</text>
        <text x="18" y="52" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="800">3,725</text>
        <path class="pulse-signal" d="M110 44 L125 32 L145 40 L175 26" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Card 3: Repositories -->
      <g transform="translate(408, 0)">
        <rect x="0" y="0" width="192" height="68" rx="8" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
        <rect x="16" y="16" width="14" height="11" rx="2" fill="#38BDF8"/>
        <text x="36" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Repositories</text>
        <text x="18" y="52" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="800">9</text>
        <path class="pulse-signal" d="M110 48 L135 48 L155 38 L175 35" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Card 4: Followers -->
      <g transform="translate(612, 0)">
        <rect x="0" y="0" width="192" height="68" rx="8" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
        <circle cx="22" cy="20" r="5" fill="#F472B6"/>
        <text x="34" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Followers</text>
        <text x="18" y="52" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="800">324K</text>
        <path class="pulse-signal" d="M110 42 L130 46 L150 32 L175 24" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>