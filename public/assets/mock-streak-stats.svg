<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <linearGradient id="streakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="495" height="195" rx="10" fill="url(#streakBg)" stroke="#30363d" stroke-width="1" />

  <!-- 3 Streak Columns -->
  <!-- Col 1: Total Contributions -->
  <g transform="translate(85, 95)" text-anchor="middle">
    <!-- Icon -->
    <circle cx="0" cy="-45" r="14" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M-6 -45 L-2 -41 L6 -49" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text y="-10" font-family="'Fira Code', monospace" font-size="24" font-weight="800" fill="#ffffff">
      4,920
    </text>
    <text y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      Total Contributions
    </text>
    <text y="30" font-family="-apple-system, sans-serif" font-size="10" fill="#7d8590">
      2024 - 2026
    </text>
  </g>

  <!-- Divider 1 -->
  <line x1="168" y1="35" x2="168" y2="160" stroke="#30363d" stroke-width="1" />

  <!-- Col 2: Current Streak (Hero Center) -->
  <g transform="translate(247, 90)" text-anchor="middle">
    <!-- Flame SVG Icon -->
    <g transform="translate(0, -42)" filter="url(#fireGlow)">
      <path d="M0 -15 C4 -7 12 -4 8 8 C6 12 1 14 0 14 C-1 14 -6 12 -8 8 C-12 -4 -4 -7 0 -15 Z" fill="url(#fireGrad)" />
      <path d="M0 -2 C2 3 5 4 3 8 C2 9 0 10 0 10 C0 10 -2 9 -3 8 C-5 4 -2 3 0 -2 Z" fill="#ffffff" opacity="0.8" />
    </g>
    <text y="-5" font-family="'Fira Code', monospace" font-size="28" font-weight="900" fill="#f59e0b">
      128
    </text>
    <text y="16" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">
      Current Streak
    </text>
    <text y="34" font-family="-apple-system, sans-serif" font-size="10" fill="#3fb950" font-weight="600">
      ✓ Daily Active
    </text>
  </g>

  <!-- Divider 2 -->
  <line x1="326" y1="35" x2="326" y2="160" stroke="#30363d" stroke-width="1" />

  <!-- Col 3: Longest Streak -->
  <g transform="translate(410, 95)" text-anchor="middle">
    <circle cx="0" cy="-45" r="14" fill="rgba(168, 85, 247, 0.15)" />
    <!-- Lightning bolt SVG -->
    <path d="M1 -53 L-4 -45 L0 -45 L-1 -37 L5 -46 L1 -46 Z" fill="#c084fc" />
    <text y="-10" font-family="'Fira Code', monospace" font-size="24" font-weight="800" fill="#ffffff">
      342
    </text>
    <text y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#c084fc">
      Longest Streak
    </text>
    <text y="30" font-family="-apple-system, sans-serif" font-size="10" fill="#7d8590">
      Consecutive Days
    </text>
  </g>
</svg>
