<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 72" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97757" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <rect width="920" height="72" rx="14" fill="#090d16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Pill 1: Anthropic Claude Code -->
  <g transform="translate(16, 14)">
    <rect width="210" height="44" rx="10" fill="rgba(217, 119, 87, 0.12)" stroke="rgba(217, 119, 87, 0.35)" stroke-width="1" />
    <circle cx="24" cy="22" r="13" fill="rgba(217, 119, 87, 0.2)" />
    <!-- Official Anthropic Claude Spark Icon (14-Point Radial Burst) -->
    <g transform="translate(24, 22)">
      <circle cx="0" cy="0" r="3.2" fill="#d97757" />
      <!-- Radial Spokes -->
      <path d="M0 -10 L0 -5 M0 5 L0 10 M-10 0 L-5 0 M5 0 L10 0 M-7 -7 L-3.5 -3.5 M3.5 3.5 L7 7 M-7 7 L-3.5 3.5 M3.5 -3.5 L7 -7" stroke="#d97757" stroke-width="1.6" stroke-linecap="round" />
      <path d="M-8.5 -3.8 L-4.5 -2 M4.5 2 L8.5 3.8 M-3.8 -8.5 L-2 -4.5 M2 4.5 L3.8 8.5" stroke="#d97757" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#fed7aa">Claude Code</text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#ea580c">Anthropic MCP Tool</text>
  </g>

  <!-- Pill 2: Google Antigravity IDE -->
  <g transform="translate(242, 14)">
    <rect width="215" height="44" rx="10" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1" />
    <circle cx="24" cy="22" r="13" fill="rgba(52, 211, 153, 0.2)" />
    <!-- Official Google Antigravity Orbital Gyroscopic Logo -->
    <g transform="translate(24, 22)">
      <!-- Core Sphere -->
      <circle cx="0" cy="0" r="3.2" fill="#34d399" />
      <!-- Orbital Ring 1 (Tilted 35deg) -->
      <ellipse cx="0" cy="0" rx="9" ry="3.8" fill="none" stroke="#10b981" stroke-width="1.4" transform="rotate(-30)" />
      <!-- Orbital Ring 2 (Tilted -45deg) -->
      <ellipse cx="0" cy="0" rx="9" ry="3.8" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(45)" />
      <!-- Quantum Node -->
      <circle cx="6.5" cy="-3.5" r="1.3" fill="#67e8f9" />
    </g>
    <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#a7f3d0">Google Antigravity</text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#059669">DeepMind Agent Studio</text>
  </g>

  <!-- Pill 3: VS Code & Cursor IDE -->
  <g transform="translate(473, 14)">
    <rect width="215" height="44" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="24" cy="22" r="13" fill="rgba(56, 189, 248, 0.2)" />
    <!-- Official VS Code Folded Ribbon & Cursor Isometric Cube -->
    <g transform="translate(17, 15)">
      <!-- VS Code Folded Ribbon -->
      <path d="M10 2 L2 8 L6 11 L2 14 L10 20 L13 18 L13 4 Z" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M6 11 L13 6 M6 11 L13 16" stroke="#38bdf8" stroke-width="1.2" />
    </g>
    <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#bae6fd">VS Code &amp; Cursor</text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0284c7">Full Editor Support</text>
  </g>

  <!-- Pill 4: Client Vector Engine (No Cloud Telemetry) -->
  <g transform="translate(704, 14)">
    <rect width="200" height="44" rx="10" fill="rgba(250, 204, 21, 0.12)" stroke="rgba(250, 204, 21, 0.35)" stroke-width="1" />
    <circle cx="24" cy="22" r="13" fill="rgba(250, 204, 21, 0.2)" />
    <!-- Vector Engine / Shield Icon -->
    <g transform="translate(24, 22)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#facc15" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2" fill="#facc15" />
      <path d="M-8 0 L-6 0 M6 0 L8 0 M0 -8 L0 -6 M0 6 L0 8" stroke="#facc15" stroke-width="1.4" />
    </g>
    <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#fef08a">Client Vector Engine</text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#ca8a04">Zero Cloud Telemetry</text>
  </g>
</svg>
