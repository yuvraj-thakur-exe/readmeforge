<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title"><title id="title">Animated developer terminal card</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1e"/><stop offset="1" stop-color="#172340"/></linearGradient><linearGradient id="border"><stop stop-color="#42e7ff"/><stop offset="1" stop-color="#a363ff"/></linearGradient></defs><rect x="1" y="1" width="998" height="278" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-opacity=".75" stroke-width="1.5"/><path d="M1 48H999" stroke="#6d8bb7" stroke-opacity=".28"/><circle cx="28" cy="25" r="5" fill="#ff6b83"/><circle cx="47" cy="25" r="5" fill="#ffd166"/><circle cx="66" cy="25" r="5" fill="#60ffb9"/><text x="92" y="30" font-family="monospace" font-size="13" fill="#96a9c2">yuvraj@dev: ~/projects</text><text x="36" y="91" font-family="monospace" font-size="17" fill="#60ffb9">$ whoami</text><text x="36" y="122" font-family="monospace" font-size="18" font-weight="bold" fill="#eef5ff">Yuvraj Thakur</text><text x="36" y="159" font-family="monospace" font-size="16" fill="#42e7ff">$ focus --on AI --build useful-things</text><text x="36" y="190" font-family="monospace" font-size="15" fill="#a9bad7">Exploring agents, software, and open source.</text><text x="36" y="225" font-family="monospace" font-size="14" fill="#a363ff">[status]</text><text x="116" y="225" font-family="monospace" font-size="14" fill="#60ffb9">building in public</text><rect class="cursor" x="302" y="211" width="9" height="18" fill="#42e7ff"/><g class="pulse"><circle cx="904" cy="144" r="54" fill="#10213f" stroke="#42e7ff" stroke-width="1.8"/><path d="M886 126h-12v36h12m28-36h12v36h-12m-3-45l-19 54" fill="none" stroke="#a363ff" stroke-width="4" stroke-linecap="round"/></g><style>.cursor{animation:blink 1s steps(2,start) infinite}.pulse{transform-origin:904px 144px;animation:pulse 3s ease-in-out infinite}@keyframes blink{to{opacity:0}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}</style></svg>