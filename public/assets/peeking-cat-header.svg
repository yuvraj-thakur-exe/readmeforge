<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="macWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="headerCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="catEarsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="badgeKotlin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#C711E1"/>
    </linearGradient>
    <linearGradient id="badgeRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEA584"/>
      <stop offset="100%" stop-color="#CE412B"/>
    </linearGradient>
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      *, .cat-wiggle, .cat-blink, .sparkle-mote {
        animation: none !important;
      }
    }
    .cat-wiggle {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: catPeeking 3.5s ease-in-out infinite alternate;
    }
    @keyframes catPeeking {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }
    .cat-blink {
      animation: catEyeBlink 4s step-end infinite;
    }
    @keyframes catEyeBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    .sparkle-mote {
      transform-box: fill-box;
      transform-origin: center;
      animation: moteTwinkle 2.5s ease-in-out infinite alternate;
    }
    @keyframes moteTwinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- PEEKING BLACK CAT MASCOT (Peering over the window frame) -->
  <g class="cat-wiggle" transform="translate(420, 10)">
    <!-- Cat Ears with glowing green inner triangles -->
    <polygon points="-46,35 -56,5 -20,22" fill="#0B0F19"/>
    <polygon points="-44,30 -52,10 -24,22" fill="url(#catEarsGlow)"/>
    <polygon points="46,35 56,5 20,22" fill="#0B0F19"/>
    <polygon points="44,30 52,10 24,22" fill="url(#catEarsGlow)"/>

    <!-- Cat Head (Rounded silhouette) -->
    <ellipse cx="0" cy="38" rx="55" ry="32" fill="#0B0F19"/>

    <!-- Glowing Green Expressive Cat Eyes -->
    <g class="cat-blink">
      <ellipse cx="-22" cy="34" rx="11" ry="14" fill="#34D399"/>
      <ellipse cx="22" cy="34" rx="11" ry="14" fill="#34D399"/>
      <!-- Pupils -->
      <ellipse cx="-22" cy="34" rx="5" ry="11" fill="#0B0F19"/>
      <ellipse cx="22" cy="34" rx="5" ry="11" fill="#0B0F19"/>
      <!-- Highlights -->
      <circle cx="-25" cy="28" r="3.5" fill="#FFFFFF"/>
      <circle cx="19" cy="28" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Cat Whiskers -->
    <line x1="-38" y1="42" x2="-62" y2="38" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="-38" y1="46" x2="-60" y2="48" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="38" y1="42" x2="62" y2="38" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="38" y1="46" x2="60" y2="48" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Paws gripping the top of the window -->
    <ellipse cx="-34" cy="54" rx="12" ry="7" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
    <ellipse cx="34" cy="54" rx="12" ry="7" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
  </g>

  <!-- MACOS README WINDOW FRAME -->
  <g transform="translate(20, 48)">
    <!-- Window Body Background -->
    <rect x="0" y="0" width="800" height="220" rx="14" fill="url(#macWindowGrad)" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <rect x="0" y="0" width="800" height="34" rx="14" fill="#161F30"/>
    <rect x="0" y="20" width="800" height="14" fill="#161F30"/>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#1F2937" stroke-width="1"/>

    <!-- macOS RGB Window Control Dots -->
    <circle cx="20" cy="17" r="5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="5" fill="#10B981"/>

    <!-- GitHub Icon & README.md Tab -->
    <g transform="translate(74, 8)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
      <circle cx="12" cy="10" r="5" fill="#94A3B8"/>
      <text x="24" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">README.md</text>
    </g>

    <!-- Preview Pill on Right -->
    <rect x="715" y="8" width="65" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="747" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Preview</text>

    <!-- WINDOW CONTENT: PROFILE HEADER CARD -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="768" height="160" rx="10" fill="url(#headerCardGrad)" stroke="#1E293B" stroke-width="1"/>

      <!-- User Handle -->
      <text x="24" y="32" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">@octocat</text>
      <!-- User Name -->
      <text x="24" y="64" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800">Alex Rivers</text>
      <!-- Role -->
      <text x="24" y="88" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Frontend &amp; Full-Stack Systems Engineer</text>

      <!-- Tech Skill Badges Row -->
      <g transform="translate(24, 108)">
        <!-- Kotlin Badge -->
        <rect x="0" y="0" width="68" height="22" rx="11" fill="url(#badgeKotlin)"/>
        <text x="34" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Kotlin</text>

        <!-- Rust Badge -->
        <rect x="76" y="0" width="60" height="22" rx="11" fill="url(#badgeRust)"/>
        <text x="106" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Rust</text>

        <!-- JavaScript Badge -->
        <rect x="144" y="0" width="82" height="22" rx="11" fill="#F7DF1E"/>
        <text x="185" y="15" fill="#000000" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">JavaScript</text>

        <!-- Python Badge -->
        <rect x="234" y="0" width="68" height="22" rx="11" fill="#3776AB"/>
        <text x="268" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Python</text>
      </g>

      <!-- Live GitHub Stats Metrics (Mid Column) -->
      <g transform="translate(370, 24)">
        <!-- Repositories -->
        <g transform="translate(0, 10)">
          <rect x="0" y="0" width="16" height="12" rx="2" fill="#38BDF8"/>
          <text x="26" y="11" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">7</text>
          <text x="46" y="11" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Repositories</text>
        </g>
        <!-- Stars -->
        <g transform="translate(0, 36)">
          <polygon points="8,0 10,6 16,6 11,10 13,16 8,12 3,16 5,10 0,6 6,6" fill="#FBBF24"/>
          <text x="26" y="12" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">5</text>
          <text x="46" y="12" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Stars</text>
        </g>
        <!-- Contributions -->
        <g transform="translate(0, 62)">
          <circle cx="8" cy="8" r="6" fill="#34D399"/>
          <text x="26" y="12" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">672</text>
          <text x="56" y="12" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Contributions</text>
        </g>
        <!-- Followers -->
        <g transform="translate(0, 88)">
          <circle cx="8" cy="6" r="4" fill="#A855F7"/>
          <text x="26" y="12" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">8</text>
          <text x="46" y="12" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Followers</text>
        </g>
      </g>

      <!-- RETRO PIXEL ART AVATAR (Right Column) -->
      <g transform="translate(630, 20)">
        <!-- Pixel frame border -->
        <rect x="0" y="0" width="112" height="120" rx="6" fill="#0B0F19" stroke="#34D399" stroke-width="1.5"/>
        <!-- Star twinkle background inside pixel frame -->
        <circle class="sparkle-mote" cx="16" cy="18" r="1.5" fill="#FFFFFF"/>
        <circle class="sparkle-mote" cx="96" cy="22" r="1.5" fill="#34D399" style="animation-delay: 0.8s;"/>
        <circle class="sparkle-mote" cx="24" cy="98" r="1.5" fill="#FBBF24" style="animation-delay: 1.4s;"/>

        <!-- Pixel Character (Retro Elf / Hero sprite) -->
        <g transform="translate(26, 20)">
          <!-- Green Elf Cap -->
          <rect x="18" y="0" width="24" height="6" fill="#15803D"/>
          <rect x="12" y="6" width="36" height="6" fill="#16A34A"/>
          <rect x="6" y="12" width="48" height="6" fill="#22C55E"/>
          <!-- Blonde Hair -->
          <rect x="6" y="18" width="48" height="12" fill="#FBBF24"/>
          <!-- Face Skin Tone -->
          <rect x="12" y="24" width="36" height="24" fill="#FDE68A"/>
          <!-- Big Blue Eyes -->
          <rect x="18" y="30" width="6" height="8" fill="#0284C7"/>
          <rect x="36" y="30" width="6" height="8" fill="#0284C7"/>
          <rect x="18" y="30" width="3" height="3" fill="#FFFFFF"/>
          <rect x="36" y="30" width="3" height="3" fill="#FFFFFF"/>
          <!-- Smile -->
          <rect x="27" y="42" width="6" height="3" fill="#D97706"/>
          <!-- Tunic Shoulders -->
          <rect x="6" y="52" width="48" height="16" fill="#15803D"/>
          <rect x="21" y="52" width="18" height="16" fill="#991B1B"/>
        </g>
      </g>
    </g>
  </g>
</svg>