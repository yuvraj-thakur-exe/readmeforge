<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono-stroke {
        stroke: #18181b;
        stroke-width: 32;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
      }
      .mono-eye {
        fill: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        .mono-stroke {
          stroke: #f4f4f5;
        }
        .mono-eye {
          fill: #f4f4f5;
        }
      }
    </style>
  </defs>

  <!-- Left Ear -->
  <path d="M 273 374 C 185 374 168 410 168 452 C 168 494 185 521 250 521" class="mono-stroke" stroke-linecap="round" fill="none" />

  <!-- Right Ear -->
  <path d="M 748 374 C 836 374 854 410 854 452 C 854 494 836 521 771 521" class="mono-stroke" stroke-linecap="round" fill="none" />

  <!-- Outer Polygonal Head -->
  <polygon points="512,195 719,310 774,493 594,733 430,733 250,493 305,310" class="mono-stroke" fill="none" />

  <!-- Inner Facial Mask / Brow Contour -->
  <path d="M 512 393 
           L 622 342 
           L 696 415 
           L 650 545 
           L 644 650 
           M 512 393 
           L 400 342 
           L 327 415 
           L 373 545 
           L 379 650" 
        class="mono-stroke" fill="none" />

  <!-- Left Eye -->
  <circle cx="424" cy="459" r="31" class="mono-eye" />

  <!-- Right Eye -->
  <circle cx="598" cy="459" r="31" class="mono-eye" />

  <!-- Nose (Upper wings meeting at tip) -->
  <path d="M 453 507 L 512 558 L 571 507" class="mono-stroke" stroke-linejoin="miter" fill="none" />

  <!-- Philtrum (Vertical stem) -->
  <line x1="512" y1="558" x2="512" y2="626" class="mono-stroke" />

  <!-- Mouth (Slight downward angle) -->
  <path d="M 432 651 L 512 626 L 592 651" class="mono-stroke" stroke-linejoin="miter" fill="none" />
</svg>
