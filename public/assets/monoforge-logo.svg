<svg width="520" height="130" viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .mono-bg {
        fill: #ffffff;
        stroke: #e4e4e7;
      }
      .mono-wordmark {
        fill: #09090b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .mono-tagline {
        fill: #71717a;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      @media (prefers-color-scheme: dark) {
        .mono-bg { fill: #18181b; stroke: #27272a; }
        .mono-wordmark { fill: #f4f4f5; }
        .mono-tagline { fill: #a1a1aa; }
      }
    </style>
  </defs>

  <!-- Left Icon: MonoForge Geometric Monkey in Card Frame -->
  <rect x="10" y="10" width="110" height="110" rx="24" class="mono-bg" stroke-width="2"/>

  <g transform="translate(15, 12) scale(0.098)" stroke="#f59e0b" stroke-width="32" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4">
    <!-- Left Ear -->
    <path d="M 273 374 C 185 374 168 410 168 452 C 168 494 185 521 250 521" stroke-linecap="round" fill="none" />
    <!-- Right Ear -->
    <path d="M 748 374 C 836 374 854 410 854 452 C 854 494 836 521 771 521" stroke-linecap="round" fill="none" />
    <!-- Outer Polygonal Head -->
    <polygon points="512,195 719,310 774,493 594,733 430,733 250,493 305,310" fill="none" />
    <!-- Inner Facial Mask / Brow Contour -->
    <path d="M 512 393 L 622 342 L 696 415 L 650 545 L 644 650 M 512 393 L 400 342 L 327 415 L 373 545 L 379 650" fill="none" />
    <!-- Eyes -->
    <circle cx="424" cy="459" r="31" fill="#f59e0b" stroke="none" />
    <circle cx="598" cy="459" r="31" fill="#f59e0b" stroke="none" />
    <!-- Nose & Philtrum -->
    <path d="M 453 507 L 512 558 L 571 507" fill="none" />
    <line x1="512" y1="558" x2="512" y2="626" />
    <!-- Mouth -->
    <path d="M 432 651 L 512 626 L 592 651" fill="none" />
  </g>

  <!-- Wordmark -->
  <text x="140" y="72" class="mono-wordmark">Mono<tspan fill="url(#monoGold)">Forge</tspan></text>
  <text x="142" y="96" class="mono-tagline">ZERO MONKEY BUSINESS &bull; PROFILE STUDIO</text>
</svg>
