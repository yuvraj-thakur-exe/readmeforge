<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Neon Glow Cyan & Purple -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.9)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowHigh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5)); }
      50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.9)); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
      50% { transform: translateY(-40px) scale(1.2); opacity: 0.9; }
      100% { transform: translateY(-80px) scale(0.5); opacity: 0; }
    }
    @keyframes borderChase {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 3200; }
    }
    @keyframes scanlineSweep {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    @keyframes badgeBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }

    .border-line {
      stroke: url(#neonCyan);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 200 400;
      animation: borderChase 12s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: 5px;
      fill: #ffffff;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .sub-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 17px;
      letter-spacing: 3px;
      fill: #94a3b8;
    }
    .badge-card {
      animation: badgeBob 5s ease-in-out infinite;
    }
    .badge-card-delay {
      animation: badgeBob 5s ease-in-out infinite -2.5s;
    }
    .scan-beam {
      animation: scanlineSweep 4s ease-in-out infinite;
    }
    .p1 { animation: floatParticle 4s ease-out infinite 0.2s; }
    .p2 { animation: floatParticle 5s ease-out infinite 1.4s; }
    .p3 { animation: floatParticle 3.8s ease-out infinite 2.1s; }
    .p4 { animation: floatParticle 4.5s ease-out infinite 0.8s; }
    .p5 { animation: floatParticle 4.2s ease-out infinite 2.8s; }
    .wave-line {
      stroke-dasharray: 20 10;
      animation: waveDash 18s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Animated Border Outline -->
  <rect x="2" y="2" width="1196" height="416" rx="18" class="border-line" />

  <!-- Subtle Laser Scanline -->
  <rect x="0" y="0" width="1200" height="15" fill="url(#laserGrad)" class="scan-beam" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="rgba(99, 102, 241, 0.15)" filter="url(#glowHigh)" />
  <circle cx="1000" cy="300" r="160" fill="rgba(192, 132, 252, 0.15)" filter="url(#glowHigh)" />
  <circle cx="600" cy="220" r="180" fill="rgba(56, 189, 248, 0.1)" filter="url(#glowHigh)" />

  <!-- Floating Spark Particles -->
  <circle cx="340" cy="310" r="3" fill="#38bdf8" class="p1" filter="url(#glow)" />
  <circle cx="580" cy="340" r="3.5" fill="#c084fc" class="p2" filter="url(#glow)" />
  <circle cx="820" cy="290" r="2.5" fill="#facc15" class="p3" filter="url(#glow)" />
  <circle cx="450" cy="330" r="3" fill="#818cf8" class="p4" filter="url(#glow)" />
  <circle cx="720" cy="320" r="2.8" fill="#34d399" class="p5" filter="url(#glow)" />

  <!-- Decorative Circuit Wave Line -->
  <path d="M 50 360 Q 250 310, 450 360 T 850 360 T 1150 360" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" class="wave-line" />

  <!-- Left Floating Badge: 6-Step Wizard -->
  <g transform="translate(100, 140)" class="badge-card">
    <rect width="210" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="rgba(99, 102, 241, 0.2)" />
    <text x="27" y="42" font-size="20">🧙</text>
    <text x="65" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Visual Wizard</text>
    <text x="65" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">6-Step Live Preview</text>
  </g>

  <!-- Left Bottom Badge: 8+ Plugins -->
  <g transform="translate(130, 235)" class="badge-card-delay">
    <rect width="210" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="rgba(56, 189, 248, 0.2)" />
    <text x="27" y="42" font-size="20">🧩</text>
    <text x="65" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Curated Plugins</text>
    <text x="65" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Stats, Trophies &amp; Snake</text>
  </g>

  <!-- Right Floating Badge: Monaco Developer Mode -->
  <g transform="translate(890, 140)" class="badge-card-delay">
    <rect width="210" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="rgba(192, 132, 252, 0.2)" />
    <text x="27" y="42" font-size="20">💻</text>
    <text x="65" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Monaco IDE</text>
    <text x="65" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Raw JSON + Zod Schema</text>
  </g>

  <!-- Right Bottom Badge: ARIA AI Dev Agent -->
  <g transform="translate(860, 235)" class="badge-card">
    <rect width="220" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 87, 34, 0.4)" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="rgba(255, 87, 34, 0.2)" />
    <text x="27" y="42" font-size="20">🤖</text>
    <text x="65" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">ARIA AI Agent</text>
    <text x="65" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Autonomous Profile Sync</text>
  </g>

  <!-- Center Content: Branding & Headlines -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Top Micro Tag -->
    <rect x="-140" y="-55" width="280" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1" />
    <text x="0" y="-36" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a5b4fc" letter-spacing="2">
      ⚡ NEXT-GEN GITHUB PROFILE STUDIO
    </text>

    <!-- Main Title -->
    <text x="0" y="25" class="main-title">READMEFORGE</text>

    <!-- Subtitle -->
    <text x="0" y="65" class="sub-title">FORGE A GITHUB PROFILE THAT DEMANDS ATTENTION</text>

    <!-- Action Pill -->
    <g transform="translate(0, 110)">
      <rect x="-160" y="-20" width="320" height="42" rx="21" fill="url(#neonCyan)" />
      <text x="0" y="6" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" fill="#0f172a" letter-spacing="1">
        EXPLORE 1-LINE QUICKSTART &gt;&gt;
      </text>
    </g>
  </g>
</svg>
