<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="200" fill="none">
  <defs>
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes dragonSoar {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50%      { transform: translateY(-24px) rotate(4deg); }
    }
    @keyframes wingTopFlap {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50%      { transform: rotate(-40deg) scaleY(0.72); }
    }
    @keyframes wingBottomFlap {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50%      { transform: rotate(30deg) scaleY(0.7); }
    }
    @keyframes fireBurst {
      0%, 100% { transform: scale(0.2) translate(0, 0); opacity: 0; }
      45%      { opacity: 0; }
      60%      { transform: scale(1.15) translate(-16px, -8px); opacity: 1; filter: drop-shadow(0 0 10px #f59e0b); }
      80%      { transform: scale(1.6) translate(-32px, -15px); opacity: 0; }
    }
    .dragon { animation: dragonSoar 3.4s ease-in-out infinite; transform-origin: center center; }
    .wing-top { transform-origin: 0px -12px; animation: wingTopFlap 0.85s ease-in-out infinite alternate; }
    .wing-bottom { transform-origin: 12px 12px; animation: wingBottomFlap 0.85s ease-in-out infinite alternate; }
    .fire { animation: fireBurst 2.2s infinite ease-out; }
  </style>

  <g transform="translate(105, 110)" class="dragon">
    <!-- Fire Breath Burst -->
    <g transform="translate(-36, -20)" class="fire">
      <path d="M 0 0 Q -18 -12 -26 -3 Q -36 -22 -10 -24 Z" fill="#f59e0b" filter="url(#fireGlow)" />
      <path d="M -5 -2 Q -15 -10 -20 -4 Q -24 -15 -10 -16 Z" fill="#ef4444" />
      <circle cx="-22" cy="-6" r="3" fill="#fef08a" />
    </g>

    <!-- Tail -->
    <path d="M 14 20 Q 42 32 38 52 Q 32 64 20 62" fill="none" stroke="#e53935" stroke-width="9" stroke-linecap="round" />
    <path d="M 20 58 Q 32 68 42 60 Q 32 52 25 56 Z" fill="#fdd835" stroke="#1a202c" stroke-width="1.6" />

    <!-- Torso -->
    <ellipse cx="2" cy="14" rx="22" ry="28" fill="#e53935" stroke="#1a202c" stroke-width="2.5" />
    <!-- Yellow Belly -->
    <path d="M -14 8 Q -10 34 0 38 Q -16 32 -14 8 Z" fill="#fdd835" stroke="#1a202c" stroke-width="1.4" />

    <!-- Legs & Claws -->
    <path d="M -5 34 L -12 45 L -7 48 L -5 45 L -2 48 Z" fill="#e53935" stroke="#1a202c" stroke-width="2" />
    <path d="M 7 32 L 3 43 L 6 46 L 8 43 L 12 46 Z" fill="#e53935" stroke="#1a202c" stroke-width="2" />

    <!-- Neck & Head -->
    <path d="M -7 8 Q -19 -6 -19 -22 Q -28 -24 -36 -19 Q -34 -28 -19 -31 Q -14 -33 -9 -26 Q -4 -18 3 -2 Z" fill="#e53935" stroke="#1a202c" stroke-width="2.5" />
    <!-- Horns -->
    <polygon points="-19,-31 -26,-43 -17,-33" fill="#e53935" stroke="#1a202c" stroke-width="1.6" />
    <polygon points="-14,-31 -19,-41 -12,-33" fill="#fdd835" stroke="#1a202c" stroke-width="1.4" />
    <!-- Eye -->
    <circle cx="-26" cy="-25" r="2.6" fill="#1a202c" />

    <!-- Top Wing -->
    <g class="wing-top">
      <path d="M -2 0 Q -28 -45 -52 -56 Q -12 -46 26 -38 Q 12 -18 4 0 Z" fill="#e53935" stroke="#1a202c" stroke-width="2.5" />
      <path d="M -52 -56 Q -34 -38 -2 0" fill="none" stroke="#1a202c" stroke-width="2" />
      <path d="M -12 -46 Q 8 -28 4 0" fill="none" stroke="#1a202c" stroke-width="2" />
      <path d="M -52 -56 Q -38 -50 -30 -45 Q -18 -40 -12 -46 Q 4 -40 26 -38" fill="none" stroke="#1a202c" stroke-width="2.2" />
    </g>

    <!-- Bottom Wing -->
    <g class="wing-bottom">
      <path d="M 7 -2 Q 34 -34 56 -26 Q 44 -8 24 14 Z" fill="#c62828" stroke="#1a202c" stroke-width="2.2" opacity="0.9" />
      <path d="M 56 -26 Q 42 -14 24 14" fill="none" stroke="#1a202c" stroke-width="1.6" />
    </g>
  </g>
</svg>
