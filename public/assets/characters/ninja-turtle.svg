<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" fill="none">
  <defs>
    <filter id="swordGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes turtleHop {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes slashL {
      0%, 100% { transform: rotate(0deg); }
      30%      { transform: rotate(-50deg) translate(-6px, -3px); }
      40%      { transform: rotate(20deg) translate(5px, 3px); }
      60%      { transform: rotate(0deg); }
    }
    @keyframes slashR {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(50deg) translate(6px, -3px); }
      60%      { transform: rotate(-20deg) translate(-5px, 3px); }
      80%      { transform: rotate(0deg); }
    }
    @keyframes slashArcL {
      0%, 25%   { opacity: 0; stroke-dashoffset: 120; }
      35%       { opacity: 1; stroke-dashoffset: 0; }
      45%, 100% { opacity: 0; stroke-dashoffset: -120; }
    }
    @keyframes slashArcR {
      0%, 45%   { opacity: 0; stroke-dashoffset: 120; }
      55%       { opacity: 1; stroke-dashoffset: 0; }
      65%, 100% { opacity: 0; stroke-dashoffset: -120; }
    }
    @keyframes ribbonWave {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(18deg) skewX(8deg); }
    }
    .turtle { transform-box: fill-box; transform-origin: center bottom; animation: turtleHop 1.6s ease-in-out infinite; }
    .katana-l { transform-box: fill-box; transform-origin: top right; animation: slashL 2.4s infinite ease-in-out; }
    .katana-r { transform-box: fill-box; transform-origin: top left; animation: slashR 2.4s infinite ease-in-out; }
    .arc-l { stroke-dasharray: 120; animation: slashArcL 2.4s infinite linear; }
    .arc-r { stroke-dasharray: 120; animation: slashArcR 2.4s infinite linear; }
    .ribbon { transform-box: fill-box; transform-origin: left center; animation: ribbonWave 1.4s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .turtle, .katana-l, .katana-r, .arc-l, .arc-r, .ribbon { animation: none !important; }
    }
  </style>

  <!-- Luminous Slash Trails -->
  <path d="M 25 35 A 65 65 0 0 1 105 100" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#swordGlow)" class="arc-l" />
  <path d="M 175 35 A 65 65 0 0 0 95 100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#swordGlow)" class="arc-r" />

  <g transform="translate(100, 100)" class="turtle">
    <!-- Back Shell -->
    <ellipse cx="0" cy="16" rx="30" ry="26" fill="#8d6e63" stroke="#1a202c" stroke-width="2.5" />

    <!-- Legs & Knee Wraps -->
    <g>
      <rect x="-24" y="28" width="16" height="26" rx="6" fill="#7cb342" stroke="#1a202c" stroke-width="2" />
      <rect x="-24" y="40" width="16" height="5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />
      <rect x="-24" y="47" width="16" height="5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />

      <rect x="8" y="28" width="16" height="26" rx="6" fill="#7cb342" stroke="#1a202c" stroke-width="2" />
      <rect x="8" y="40" width="16" height="5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />
      <rect x="8" y="47" width="16" height="5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />
    </g>

    <!-- Front Plastron (Belly Plates) -->
    <rect x="-20" y="4" width="40" height="34" rx="10" fill="#ffe0b2" stroke="#1a202c" stroke-width="2" />
    <line x1="0" y1="4" x2="0" y2="38" stroke="#1a202c" stroke-width="1.5" />
    <line x1="-18" y1="20" x2="18" y2="20" stroke="#1a202c" stroke-width="1.5" />
    <circle cx="0" cy="33" r="3.5" fill="#8d6e63" stroke="#1a202c" stroke-width="1.2" />

    <!-- Left Katana (Held) -->
    <g class="katana-l">
      <!-- Arm -->
      <ellipse cx="-28" cy="18" rx="8" ry="14" fill="#7cb342" stroke="#1a202c" stroke-width="2" />
      <rect x="-36" y="14" width="16" height="4.5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />
      <!-- Hand Guard & Hilt -->
      <rect x="-35" y="14" width="14" height="4" rx="1.5" fill="#37474f" stroke="#1a202c" stroke-width="1.2" />
      <rect x="-30" y="18" width="4.5" height="18" rx="1.5" fill="#455a64" stroke="#1a202c" stroke-width="1.2" />
      <!-- Steel Blade -->
      <path d="M -30 14 L -30 -38 L -26 -44 L -26 14 Z" fill="#cfd8dc" stroke="#1a202c" stroke-width="1.5" />
      <line x1="-28" y1="12" x2="-28" y2="-40" stroke="#ffffff" stroke-width="1.2" />
    </g>

    <!-- Right Katana (Held) -->
    <g class="katana-r">
      <!-- Arm -->
      <ellipse cx="28" cy="18" rx="8" ry="14" fill="#7cb342" stroke="#1a202c" stroke-width="2" />
      <rect x="20" y="14" width="16" height="4.5" fill="#1e88e5" stroke="#1a202c" stroke-width="1.2" />
      <!-- Hand Guard & Hilt -->
      <rect x="21" y="14" width="14" height="4" rx="1.5" fill="#37474f" stroke="#1a202c" stroke-width="1.2" />
      <rect x="25.5" y="18" width="4.5" height="18" rx="1.5" fill="#455a64" stroke="#1a202c" stroke-width="1.2" />
      <!-- Steel Blade -->
      <path d="M 26 14 L 26 -38 L 30 -44 L 30 14 Z" fill="#cfd8dc" stroke="#1a202c" stroke-width="1.5" />
      <line x1="28" y1="12" x2="28" y2="-40" stroke="#ffffff" stroke-width="1.2" />
    </g>

    <!-- Head -->
    <g>
      <ellipse cx="0" cy="-18" rx="28" ry="23" fill="#7cb342" stroke="#1a202c" stroke-width="2.5" />

      <!-- Blue Mask Bandana -->
      <path d="M -26 -24 C -15 -20 15 -20 26 -24 C 28 -16 26 -10 26 -13 C 15 -15 -15 -15 -26 -13 Z" fill="#1e88e5" stroke="#1a202c" stroke-width="2" />

      <!-- Fluttering Bandana Tails -->
      <g class="ribbon">
        <path d="M 25 -20 Q 38 -24 48 -14 Q 38 -10 27 -14 Z" fill="#1e88e5" stroke="#1a202c" stroke-width="1.5" />
        <path d="M 26 -16 Q 42 -14 44 -4 Q 35 -2 27 -10 Z" fill="#1976d2" stroke="#1a202c" stroke-width="1.5" />
      </g>

      <!-- Eyes & Pupils -->
      <circle cx="-12" cy="-19" r="4.5" fill="#1a202c" />
      <circle cx="-13" cy="-20.5" r="1.5" fill="#ffffff" />
      <circle cx="12" cy="-19" r="4.5" fill="#1a202c" />
      <circle cx="11" cy="-20.5" r="1.5" fill="#ffffff" />

      <!-- Mouth -->
      <path d="M -16 -6 Q 0 2 16 -6" stroke="#1a202c" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
