<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="200" fill="none">
  <defs>
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes botHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-16px) rotate(2deg); }
    }
    @keyframes armWaveL {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-38deg); }
    }
    @keyframes armWaveR {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(45deg); }
    }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #48cfad); }
      50%      { transform: scale(1.3); filter: drop-shadow(0 0 8px #48cfad); }
    }
    @keyframes eyeBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }
    .hover-bot { animation: botHover 3s ease-in-out infinite; transform-origin: center bottom; }
    .arm-l { transform-origin: -18px 0px; animation: armWaveL 2s ease-in-out infinite; }
    .arm-r { transform-origin: 18px 0px; animation: armWaveR 2s ease-in-out infinite; }
    .core { transform-origin: 0px 8px; animation: corePulse 1.5s ease-in-out infinite; }
    .eyes { transform-origin: 0px -14px; animation: eyeBlink 3.8s infinite; }
  </style>

  <g transform="translate(100, 100)" class="hover-bot">
    <!-- Side Ear Pods -->
    <circle cx="-42" cy="-24" r="12" fill="#2b82c9" stroke="#1d5785" stroke-width="2" />
    <circle cx="42" cy="-24" r="12" fill="#2b82c9" stroke="#1d5785" stroke-width="2" />

    <!-- Head Dome -->
    <rect x="-38" y="-54" width="76" height="58" rx="29" fill="#2b82c9" stroke="#1d5785" stroke-width="2.5" />
    <rect x="-29" y="-45" width="58" height="40" rx="20" fill="#eef2f7" />
    <rect x="-25" y="-41" width="50" height="32" rx="16" fill="#48cfad" />

    <!-- Smiling Eyes ^ ^ -->
    <g class="eyes" stroke="#37474f" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M -16 -24 C -16 -31 -8 -31 -8 -24" />
      <path d="M 8 -24 C 8 -31 16 -31 16 -24" />
    </g>

    <!-- Torso -->
    <rect x="-28" y="10" width="56" height="38" rx="19" fill="#2b82c9" stroke="#1d5785" stroke-width="2.5" />
    <path d="M -26 34 Q 0 50 26 34 Z" fill="#1d5785" />

    <!-- Chest Emblem (Cyan Diamond) -->
    <polygon points="0,20 10,29 0,38 -10,29" fill="#48cfad" class="core" />

    <!-- Shoulder Joints -->
    <rect x="-46" y="16" width="20" height="12" rx="5" fill="#1d5785" />
    <rect x="26" y="16" width="20" height="12" rx="5" fill="#1d5785" />

    <!-- Left Arm (Waving) -->
    <g class="arm-l">
      <rect x="-42" y="27" width="8" height="26" rx="4" fill="#9e9e9e" stroke="#37474f" stroke-width="1.2" />
      <circle cx="-38" cy="58" r="8.5" fill="#1d5785" stroke="#37474f" stroke-width="1.5" />
    </g>

    <!-- Right Arm (Waving) -->
    <g class="arm-r">
      <rect x="34" y="27" width="8" height="26" rx="4" fill="#9e9e9e" stroke="#37474f" stroke-width="1.2" />
      <circle cx="38" cy="58" r="8.5" fill="#1d5785" stroke="#37474f" stroke-width="1.5" />
    </g>

    <!-- Bottom Thruster Caster -->
    <path d="M -11 45 L 11 45 L 8 57 L -8 57 Z" fill="#37474f" />
    <ellipse cx="0" cy="59" rx="7" ry="3.5" fill="#22d3ee" filter="url(#botGlow)" />
  </g>
</svg>
