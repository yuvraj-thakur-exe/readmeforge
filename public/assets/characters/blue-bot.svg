<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" fill="none">
  <defs>
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes botHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-14px) rotate(2deg); }
    }
    @keyframes armWaveL {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-35deg); }
    }
    @keyframes armWaveR {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(40deg); }
    }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #48cfad); }
      50%      { transform: scale(1.25); filter: drop-shadow(0 0 8px #48cfad); }
    }
    @keyframes eyeBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }
    .hover-bot { transform-box: fill-box; transform-origin: center bottom; animation: botHover 3s ease-in-out infinite; }
    .arm-l { transform-box: fill-box; transform-origin: top right; animation: armWaveL 2s ease-in-out infinite; }
    .arm-r { transform-box: fill-box; transform-origin: top left; animation: armWaveR 2s ease-in-out infinite; }
    .core { transform-box: fill-box; transform-origin: center; animation: corePulse 1.5s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: eyeBlink 3.8s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hover-bot, .arm-l, .arm-r, .core, .eyes { animation: none !important; }
    }
  </style>

  <g transform="translate(100, 95)" class="hover-bot">
    <!-- Side Ear Pods -->
    <circle cx="-38" cy="-22" r="10" fill="#2b82c9" stroke="#1d5785" stroke-width="2" />
    <circle cx="38" cy="-22" r="10" fill="#2b82c9" stroke="#1d5785" stroke-width="2" />

    <!-- Head Dome -->
    <rect x="-34" y="-50" width="68" height="52" rx="26" fill="#2b82c9" stroke="#1d5785" stroke-width="2.5" />
    <rect x="-26" y="-42" width="52" height="36" rx="18" fill="#eef2f7" />
    <rect x="-22" y="-38" width="44" height="28" rx="14" fill="#48cfad" />

    <!-- Smiling Eyes ^ ^ -->
    <g class="eyes" stroke="#37474f" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M -14 -22 C -14 -28 -7 -28 -7 -22" />
      <path d="M 7 -22 C 7 -28 14 -28 14 -22" />
    </g>

    <!-- Torso -->
    <rect x="-25" y="8" width="50" height="34" rx="17" fill="#2b82c9" stroke="#1d5785" stroke-width="2.5" />
    <path d="M -23 28 Q 0 44 23 28 Z" fill="#1d5785" />

    <!-- Chest Emblem (Cyan Diamond) -->
    <polygon points="0,17 9,25 0,33 -9,25" fill="#48cfad" class="core" />

    <!-- Shoulder Joints -->
    <rect x="-40" y="14" width="18" height="10" rx="4" fill="#1d5785" />
    <rect x="22" y="14" width="18" height="10" rx="4" fill="#1d5785" />

    <!-- Left Arm (Waving) -->
    <g class="arm-l">
      <rect x="-36" y="23" width="7" height="23" rx="3.5" fill="#9e9e9e" stroke="#37474f" stroke-width="1.2" />
      <circle cx="-32" cy="50" r="7.5" fill="#1d5785" stroke="#37474f" stroke-width="1.5" />
    </g>

    <!-- Right Arm (Waving) -->
    <g class="arm-r">
      <rect x="29" y="23" width="7" height="23" rx="3.5" fill="#9e9e9e" stroke="#37474f" stroke-width="1.2" />
      <circle cx="32" cy="50" r="7.5" fill="#1d5785" stroke="#37474f" stroke-width="1.5" />
    </g>

    <!-- Bottom Thruster Caster -->
    <path d="M -10 39 L 10 39 L 7 50 L -7 50 Z" fill="#37474f" />
    <ellipse cx="0" cy="52" rx="6" ry="3" fill="#22d3ee" filter="url(#botGlow)" />
  </g>
</svg>
