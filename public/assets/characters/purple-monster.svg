<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" fill="none">
  <style>
    @keyframes monsterStomp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-8px) rotate(-3deg); }
      50%      { transform: translateY(0) rotate(0deg); }
      75%      { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes jawChomp {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.3) translateY(2px); }
    }
    @keyframes eyesWander {
      0%, 100% { transform: translate(0, 0); }
      30%      { transform: translate(-3px, 1px); }
      70%      { transform: translate(3px, -1px); }
    }
    @keyframes hornWiggle {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(8deg); }
    }
    .monster { transform-box: fill-box; transform-origin: center bottom; animation: monsterStomp 1.4s ease-in-out infinite; }
    .jaw { transform-box: fill-box; transform-origin: center top; animation: jawChomp 1.4s ease-in-out infinite; }
    .pupils { transform-box: fill-box; transform-origin: center; animation: eyesWander 3s ease-in-out infinite; }
    .horns { transform-box: fill-box; transform-origin: center; animation: hornWiggle 2.5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .monster, .jaw, .pupils, .horns { animation: none !important; }
    }
  </style>

  <g transform="translate(100, 100)" class="monster">
    <!-- Horns -->
    <g class="horns">
      <!-- Left Horn -->
      <path d="M -24 -36 C -36 -52 -50 -42 -44 -28 Z" fill="#ffccbc" stroke="#1a202c" stroke-width="2.5" />
      <path d="M -30 -38 C -36 -46 -44 -42 -42 -34 Z" fill="#ffab91" />
      <!-- Right Horn -->
      <path d="M 24 -36 C 36 -52 50 -42 44 -28 Z" fill="#ffccbc" stroke="#1a202c" stroke-width="2.5" />
      <path d="M 30 -38 C 36 -46 44 -42 42 -34 Z" fill="#ffab91" />
    </g>

    <!-- Side Drooping Arms -->
    <path d="M -34 -12 C -46 -12 -54 18 -44 42 C -36 34 -34 16 -30 2 Z" fill="#7986cb" stroke="#1a202c" stroke-width="2.5" />
    <path d="M 34 -12 C 46 -12 54 18 44 42 C 36 34 34 16 30 2 Z" fill="#7986cb" stroke="#1a202c" stroke-width="2.5" />

    <!-- Main Blocky Body -->
    <rect x="-34" y="-36" width="68" height="82" rx="17" fill="#7986cb" stroke="#1a202c" stroke-width="3" />

    <!-- Big White Eyes -->
    <g>
      <circle cx="-14" cy="-9" r="14" fill="#ffffff" stroke="#1a202c" stroke-width="2.5" />
      <circle cx="14" cy="-9" r="14" fill="#ffffff" stroke="#1a202c" stroke-width="2.5" />

      <!-- Blue Pupils with Wandering Animation -->
      <g class="pupils">
        <circle cx="-13" cy="-8" r="6" fill="#2196f3" />
        <circle cx="-15" cy="-10" r="2" fill="#ffffff" />
        <circle cx="15" cy="-8" r="6" fill="#2196f3" />
        <circle cx="13" cy="-10" r="2" fill="#ffffff" />
      </g>
    </g>

    <!-- Chomping Mouth with Teeth -->
    <g class="jaw">
      <rect x="-24" y="20" width="48" height="19" rx="9.5" fill="#1a202c" />
      <!-- Upper Fangs -->
      <polygon points="-16,20 -13,29 -10,20" fill="#ffffff" stroke="#1a202c" stroke-width="1.2" />
      <polygon points="10,20 13,29 16,20" fill="#ffffff" stroke="#1a202c" stroke-width="1.2" />
      <!-- Lower Tusks -->
      <polygon points="-18,39 -14,14 -10,39" fill="#ffffff" stroke="#1a202c" stroke-width="1.8" />
      <polygon points="10,39 14,14 18,39" fill="#ffffff" stroke="#1a202c" stroke-width="1.8" />
    </g>

    <!-- Stubby Stomping Feet -->
    <g>
      <rect x="-24" y="42" width="16" height="18" rx="7" fill="#7986cb" stroke="#1a202c" stroke-width="2.5" />
      <rect x="8" y="42" width="16" height="18" rx="7" fill="#7986cb" stroke="#1a202c" stroke-width="2.5" />
    </g>
  </g>
</svg>
