<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="djBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="djGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#262626" stroke-width="0.7" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes djEqPulse {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }
    @keyframes djVinylSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes djMonkeyGroove {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-1.5deg); }
      75% { transform: translateY(-2px) rotate(1.5deg); }
    }
    @keyframes djWaveTravel {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes djBezelGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }

    .dj-groove {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: djMonkeyGroove 1.6s ease-in-out infinite;
    }
    .dj-vinyl-left {
      transform-box: fill-box;
      transform-origin: center;
      animation: djVinylSpin 3s linear infinite;
    }
    .dj-vinyl-right {
      transform-box: fill-box;
      transform-origin: center;
      animation: djVinylSpin 2.4s linear infinite reverse;
    }
    .eq-bar-1 { transform-box: fill-box; transform-origin: bottom; animation: djEqPulse 0.9s ease-in-out infinite 0.1s; }
    .eq-bar-2 { transform-box: fill-box; transform-origin: bottom; animation: djEqPulse 0.7s ease-in-out infinite 0.25s; }
    .eq-bar-3 { transform-box: fill-box; transform-origin: bottom; animation: djEqPulse 1.1s ease-in-out infinite 0.05s; }
    .eq-bar-4 { transform-box: fill-box; transform-origin: bottom; animation: djEqPulse 0.8s ease-in-out infinite 0.35s; }
    .eq-bar-5 { transform-box: fill-box; transform-origin: bottom; animation: djEqPulse 1.0s ease-in-out infinite 0.2s; }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: djWaveTravel 2s linear infinite;
    }
    .border-glow {
      animation: djBezelGlow 3s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .dj-groove, .dj-vinyl-left, .dj-vinyl-right, .eq-bar-1, .eq-bar-2, .eq-bar-3, .eq-bar-4, .eq-bar-5, .wave-line, .border-glow {
        animation: none !important;
      }
    }
  </style>

  <!-- Background Chassis -->
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#djBg)" stroke="#27272a" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#djGrid)" />
  <rect x="2" y="2" width="876" height="256" rx="16" fill="none" stroke="url(#amberGold)" stroke-width="1" class="border-glow" />

  <!-- Top Status Strip -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <text x="18" y="10" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      STUDIO SESSION // 128 BPM • ZERO MONKEY BUSINESS • CAMO 60FPS
    </text>
    <rect x="730" y="0" width="100" height="18" rx="4" fill="#18181b" stroke="#27272a" />
    <text x="742" y="13" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="700">LIVE AUDIO ON</text>
  </g>

  <!-- Left Vinyl Deck -->
  <g transform="translate(60, 60)">
    <circle cx="85" cy="85" r="75" fill="#18181b" stroke="#27272a" stroke-width="3" />
    <g class="dj-vinyl-left">
      <circle cx="85" cy="85" r="65" fill="#09090b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 2" />
      <circle cx="85" cy="85" r="50" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
      <circle cx="85" cy="85" r="32" fill="#09090b" />
      <circle cx="85" cy="85" r="22" fill="url(#amberGold)" />
      <circle cx="85" cy="85" r="6" fill="#09090b" />
      <!-- Vinyl Tone Arm -->
      <line x1="85" y1="20" x2="85" y2="40" stroke="#f59e0b" stroke-width="2" />
    </g>
    <!-- Speed Marker -->
    <text x="58" y="180" fill="#71717a" font-family="monospace" font-size="9" font-weight="600">DECK A // 33.3 RPM</text>
  </g>

  <!-- Center Cyber Monkey DJ -->
  <g class="dj-groove" transform="translate(360, 50)">
    <!-- Monkey Body -->
    <rect x="40" y="80" width="80" height="75" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 60 110 Q 80 125 100 110" stroke="url(#cyanNeon)" stroke-width="2" fill="none" />

    <!-- Cyber Monkey Head -->
    <rect x="30" y="10" width="100" height="85" rx="36" fill="#27272a" stroke="#f59e0b" stroke-width="2" />

    <!-- Left Ear with Banana Ring -->
    <circle cx="20" cy="50" r="18" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="50" r="8" fill="#f59e0b" opacity="0.6" />

    <!-- Right Ear with Banana Ring -->
    <circle cx="140" cy="50" r="18" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="140" cy="50" r="8" fill="#f59e0b" opacity="0.6" />

    <!-- Cyber Headband / Headphones -->
    <path d="M 20 40 Q 80 -8 140 40" stroke="#f59e0b" stroke-width="7" fill="none" stroke-linecap="round" />
    <rect x="12" y="32" width="16" height="32" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="132" y="32" width="16" height="32" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Cyber Visor / Eyes -->
    <rect x="42" y="32" width="76" height="28" rx="8" fill="#09090b" stroke="url(#cyanNeon)" stroke-width="1.8" />
    <!-- Pupils glowing -->
    <circle cx="62" cy="46" r="6" fill="#22d3ee" />
    <circle cx="98" cy="46" r="6" fill="#22d3ee" />
    <line x1="42" y1="46" x2="118" y2="46" stroke="#0891b2" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 2" />

    <!-- Snout & Smile -->
    <ellipse cx="80" cy="74" rx="22" ry="14" fill="#3f3f46" />
    <path d="M 72 74 Q 80 82 88 74" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- DJ Hands on Knobs -->
    <circle cx="30" cy="145" r="9" fill="#f59e0b" />
    <circle cx="130" cy="145" r="9" fill="#f59e0b" />
  </g>

  <!-- Right Vinyl Deck -->
  <g transform="translate(660, 60)">
    <circle cx="85" cy="85" r="75" fill="#18181b" stroke="#27272a" stroke-width="3" />
    <g class="dj-vinyl-right">
      <circle cx="85" cy="85" r="65" fill="#09090b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 2" />
      <circle cx="85" cy="85" r="50" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
      <circle cx="85" cy="85" r="32" fill="#09090b" />
      <circle cx="85" cy="85" r="22" fill="url(#cyanNeon)" />
      <circle cx="85" cy="85" r="6" fill="#09090b" />
      <line x1="85" y1="20" x2="85" y2="40" stroke="#06b6d4" stroke-width="2" />
    </g>
    <!-- Speed Marker -->
    <text x="58" y="180" fill="#71717a" font-family="monospace" font-size="9" font-weight="600">DECK B // 45.0 RPM</text>
  </g>

  <!-- Mixer Equalizer & Crossfader (Center Bottom) -->
  <g transform="translate(260, 185)">
    <!-- Audio Waveform -->
    <path d="M 0 15 Q 40 -5 80 15 T 160 15 T 240 15 T 320 15 T 360 15" stroke="url(#cyanNeon)" stroke-width="1.5" fill="none" class="wave-line" opacity="0.6" />

    <!-- Graphic Equalizer Bars -->
    <g transform="translate(110, 0)">
      <!-- Channel 1 -->
      <rect x="0" y="5" width="6" height="24" rx="2" fill="url(#amberGold)" class="eq-bar-1" />
      <rect x="10" y="2" width="6" height="27" rx="2" fill="url(#amberGold)" class="eq-bar-2" />
      <rect x="20" y="0" width="6" height="29" rx="2" fill="url(#amberGold)" class="eq-bar-3" />
      <rect x="30" y="4" width="6" height="25" rx="2" fill="url(#amberGold)" class="eq-bar-4" />
      <!-- Master Level -->
      <rect x="44" y="0" width="4" height="29" rx="1" fill="#10b981" class="eq-bar-5" />
      <rect x="52" y="0" width="4" height="29" rx="1" fill="#10b981" class="eq-bar-3" />
      <!-- Channel 2 -->
      <rect x="64" y="4" width="6" height="25" rx="2" fill="url(#cyanNeon)" class="eq-bar-4" />
      <rect x="74" y="0" width="6" height="29" rx="2" fill="url(#cyanNeon)" class="eq-bar-3" />
      <rect x="84" y="2" width="6" height="27" rx="2" fill="url(#cyanNeon)" class="eq-bar-2" />
      <rect x="94" y="5" width="6" height="24" rx="2" fill="url(#cyanNeon)" class="eq-bar-1" />
    </g>

    <!-- Crossfader Slot & Thumb -->
    <rect x="100" y="38" width="160" height="6" rx="3" fill="#18181b" stroke="#3f3f46" />
    <rect x="170" y="34" width="18" height="14" rx="3" fill="#f59e0b" stroke="#fff" stroke-width="0.5" />
    <text x="145" y="58" fill="#71717a" font-family="monospace" font-size="8" font-weight="600">CROSSFADER // ZERO MONKEY JITTER</text>
  </g>
</svg>

