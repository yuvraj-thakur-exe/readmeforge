<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" fill="none">
  <defs>
    <linearGradient id="speed-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="798" height="318" rx="14" fill="url(#speed-bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(28, 36)">
    <text x="0" y="13" fill="#f0f6fc" font-size="16" font-weight="700" class="font-base">
      PageSpeed &amp; Web Vitals Audit
    </text>
    <text x="240" y="13" fill="#8b949e" font-size="13" class="font-mono">
      readmeforge.dev
    </text>
    <rect x="670" y="-3" width="102" height="22" rx="6" fill="#0e4429" stroke="#26a641" />
    <text x="721" y="12" fill="#39d353" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">
      ALL GREEN ⚡
    </text>
  </g>

  <!-- Gauges -->
  <g>
    
      <g transform="translate(70, 130)">
        <!-- Gauge Track -->
        <circle cx="45" cy="45" r="36" stroke="#21262d" stroke-width="8" fill="none" />
        <!-- Gauge Fill -->
        <circle
          cx="45" cy="45" r="36"
          stroke="#10b981"
          stroke-width="8"
          fill="none"
          stroke-dasharray="226.2 226.2"
          stroke-linecap="round"
          transform="rotate(-90 45 45)"
        />
        <!-- Score -->
        <text x="45" y="52" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle" class="font-mono">100</text>
        <!-- Label -->
        <text x="45" y="105" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle" class="font-base">Performance</text>
      </g>
    
      <g transform="translate(250, 130)">
        <!-- Gauge Track -->
        <circle cx="45" cy="45" r="36" stroke="#21262d" stroke-width="8" fill="none" />
        <!-- Gauge Fill -->
        <circle
          cx="45" cy="45" r="36"
          stroke="#10b981"
          stroke-width="8"
          fill="none"
          stroke-dasharray="226.2 226.2"
          stroke-linecap="round"
          transform="rotate(-90 45 45)"
        />
        <!-- Score -->
        <text x="45" y="52" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle" class="font-mono">100</text>
        <!-- Label -->
        <text x="45" y="105" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle" class="font-base">Accessibility</text>
      </g>
    
      <g transform="translate(430, 130)">
        <!-- Gauge Track -->
        <circle cx="45" cy="45" r="36" stroke="#21262d" stroke-width="8" fill="none" />
        <!-- Gauge Fill -->
        <circle
          cx="45" cy="45" r="36"
          stroke="#10b981"
          stroke-width="8"
          fill="none"
          stroke-dasharray="226.2 226.2"
          stroke-linecap="round"
          transform="rotate(-90 45 45)"
        />
        <!-- Score -->
        <text x="45" y="52" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle" class="font-mono">100</text>
        <!-- Label -->
        <text x="45" y="105" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle" class="font-base">Best Practices</text>
      </g>
    
      <g transform="translate(610, 130)">
        <!-- Gauge Track -->
        <circle cx="45" cy="45" r="36" stroke="#21262d" stroke-width="8" fill="none" />
        <!-- Gauge Fill -->
        <circle
          cx="45" cy="45" r="36"
          stroke="#10b981"
          stroke-width="8"
          fill="none"
          stroke-dasharray="226.2 226.2"
          stroke-linecap="round"
          transform="rotate(-90 45 45)"
        />
        <!-- Score -->
        <text x="45" y="52" fill="#f0f6fc" font-size="20" font-weight="800" text-anchor="middle" class="font-mono">100</text>
        <!-- Label -->
        <text x="45" y="105" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle" class="font-base">SEO</text>
      </g>
    
  </g>

  <!-- Core Web Vitals Row -->
  <g transform="translate(28, 260)">
    <rect x="0" y="0" width="744" height="36" rx="6" fill="#161b22" stroke="#21262d" />
    <text x="20" y="23" fill="#8b949e" font-size="11" class="font-mono">FCP: <tspan fill="#34d399" font-weight="700">0.6s</tspan></text>
    <text x="180" y="23" fill="#8b949e" font-size="11" class="font-mono">LCP: <tspan fill="#34d399" font-weight="700">0.9s</tspan></text>
    <text x="340" y="23" fill="#8b949e" font-size="11" class="font-mono">CLS: <tspan fill="#34d399" font-weight="700">0.00</tspan></text>
    <text x="500" y="23" fill="#8b949e" font-size="11" class="font-mono">TBT: <tspan fill="#34d399" font-weight="700">0 ms</tspan></text>
    <text x="660" y="23" fill="#58a6ff" font-size="11" font-weight="700" class="font-mono">PASS ✓</text>
  </g>
</svg>