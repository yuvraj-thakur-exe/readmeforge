<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="offset" values="0; 1; 0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#818cf8">
        <animate attributeName="offset" values="0.25; 1.25; 0.25" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="offset" values="0.5; 1.5; 0.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#22c55e">
        <animate attributeName="offset" values="0.75; 1.75; 0.75" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="offset" values="1; 2; 1" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* Neon Pulse Effect */
    .neon-pulse {
      animation: neonPulse 2.5s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes neonPulse {
      0% { opacity: 0.85; filter: drop-shadow(0 0 2px #06b6d4) drop-shadow(0 0 6px #3b82f6); }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #22d3ee) drop-shadow(0 0 16px #6366f1); }
      100% { opacity: 0.9; filter: drop-shadow(0 0 3px #06b6d4) drop-shadow(0 0 8px #3b82f6); }
    }

    /* Glitch Chromatic Aberration */
    .glitch-cyan {
      animation: glitchAnimCyan 3s infinite steps(2, start);
      transform-box: fill-box;
      transform-origin: center;
    }
    .glitch-pink {
      animation: glitchAnimPink 3s infinite steps(2, start);
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes glitchAnimCyan {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0.95; }
      89% { transform: translate(-2px, 1px); opacity: 0.8; }
      91% { transform: translate(3px, -1px); opacity: 0.9; }
      93% { transform: translate(-1px, 2px); opacity: 0.85; }
      95% { transform: translate(0, 0); opacity: 0.95; }
    }
    @keyframes glitchAnimPink {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0.75; }
      89% { transform: translate(2px, -1px); opacity: 0.9; }
      91% { transform: translate(-3px, 1px); opacity: 0.8; }
      93% { transform: translate(1px, -2px); opacity: 0.85; }
      95% { transform: translate(0, 0); opacity: 0.75; }
    }

    /* Matrix Digital Flicker */
    .matrix-text {
      animation: matrixFlicker 3s infinite;
      transform-box: fill-box;
    }
    @keyframes matrixFlicker {
      0%, 100% { opacity: 0.95; }
      35% { opacity: 0.75; }
      36% { opacity: 1; }
      68% { opacity: 0.85; }
      70% { opacity: 0.6; }
      72% { opacity: 0.95; }
    }

    /* Harmonic Wave Letters */
    .wave-char {
      display: inline-block;
      animation: waveBounce 2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes waveBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .w1 { animation-delay: 0.0s; }
    .w2 { animation-delay: 0.15s; }
    .w3 { animation-delay: 0.3s; }
    .w4 { animation-delay: 0.45s; }
    .w5 { animation-delay: 0.6s; }
    .w6 { animation-delay: 0.75s; }
    .w7 { animation-delay: 0.9s; }
    .w8 { animation-delay: 1.05s; }

    /* Terminal Cursor Blink */
    .cursor-blink {
      animation: cursorBlink 0.9s infinite step-end;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Border Beam */
    .border-beam {
      stroke-dasharray: 120 400;
      animation: beamTravel 6s linear infinite;
    }
    @keyframes beamTravel {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1040; }
    }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="2" y="2" width="956" height="336" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="2" y="2" width="956" height="336" rx="14" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Border Beam -->
  <rect x="2" y="2" width="956" height="336" rx="14" fill="none" stroke="url(#neonCyanPurple)" stroke-width="2.5" class="border-beam" />

  <!-- Header Banner -->
  <g transform="translate(32, 28)">
    <circle cx="8" cy="8" r="4.5" fill="#22c55e" filter="url(#neonGlow)" />
    <text x="24" y="13" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="2" class="font-mono">MONOFORGE // KINETIC TYPOGRAPHY &amp; TEXT EFFECTS ENGINE</text>
    <text x="24" y="34" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="-0.5" class="font-sans">GitHub-Safe Vector Motion, Dynamic Gradients &amp; Kinetic Color Stacks</text>
  </g>

  <!-- Module 1: Cyber Neon Glow -->
  <g transform="translate(32, 85)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#06b6d4" />
    <text x="26" y="18" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">EFFECT 01 // NEON GLOW</text>
    <text x="140" y="58" text-anchor="middle" fill="#22d3ee" font-size="17" font-weight="900" letter-spacing="1" class="font-sans neon-pulse">CYBERPUNK GLOW</text>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">Dual-stage drop-shadow bloom</text>
  </g>

  <!-- Module 2: Holographic Gradient Shimmer -->
  <g transform="translate(340, 85)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#ec4899" />
    <text x="26" y="18" fill="#f472b6" font-size="10" font-weight="700" class="font-mono">EFFECT 02 // GRADIENT SHIMMER</text>
    <text x="140" y="58" text-anchor="middle" fill="url(#shimmerGradient)" font-size="17" font-weight="900" letter-spacing="0.5" class="font-sans">HOLOGRAPHIC CHROME</text>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">4-Stop animated spectral sweep</text>
  </g>

  <!-- Module 3: Chromatic Glitch -->
  <g transform="translate(648, 85)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#ef4444" />
    <text x="26" y="18" fill="#f87171" font-size="10" font-weight="700" class="font-mono">EFFECT 03 // RGB GLITCH</text>
    <!-- Cyan Layer -->
    <text x="140" y="58" text-anchor="middle" fill="#06b6d4" font-size="17" font-weight="900" letter-spacing="1" class="font-sans glitch-cyan">SYSTEM DECRYPT</text>
    <!-- Pink Layer -->
    <text x="140" y="58" text-anchor="middle" fill="#ec4899" font-size="17" font-weight="900" letter-spacing="1" class="font-sans glitch-pink">SYSTEM DECRYPT</text>
    <!-- White Primary Layer -->
    <text x="140" y="58" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="900" letter-spacing="1" class="font-sans">SYSTEM DECRYPT</text>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">Sub-pixel chromatic displacement</text>
  </g>

  <!-- Module 4: Matrix Phosphor Green -->
  <g transform="translate(32, 205)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#22c55e" />
    <text x="26" y="18" fill="#4ade80" font-size="10" font-weight="700" class="font-mono">EFFECT 04 // MATRIX PHOSPHOR</text>
    <text x="140" y="58" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="800" filter="url(#matrixGlow)" class="font-mono matrix-text">&gt; 0xDEADBEEF_OK</text>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">Cathode-ray phosphor luminescence</text>
  </g>

  <!-- Module 5: Harmonic Sinusoidal Wave -->
  <g transform="translate(340, 205)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#f59e0b" />
    <text x="26" y="18" fill="#fbbf24" font-size="10" font-weight="700" class="font-mono">EFFECT 05 // HARMONIC WAVE</text>
    <g transform="translate(75, 60)" filter="url(#amberGlow)">
      <text x="0" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w1">K</text>
      <text x="15" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w2">I</text>
      <text x="24" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w3">N</text>
      <text x="39" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w4">E</text>
      <text x="53" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w5">T</text>
      <text x="66" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w6">I</text>
      <text x="74" y="0" fill="#fbbf24" font-size="17" font-weight="800" class="font-sans wave-char w7">C</text>
      <text x="89" y="0" fill="#f59e0b" font-size="17" font-weight="800" class="font-sans wave-char w8">_</text>
      <text x="105" y="0" fill="#f59e0b" font-size="17" font-weight="800" class="font-sans wave-char w1">F</text>
      <text x="117" y="0" fill="#f59e0b" font-size="17" font-weight="800" class="font-sans wave-char w2">L</text>
      <text x="128" y="0" fill="#f59e0b" font-size="17" font-weight="800" class="font-sans wave-char w3">O</text>
      <text x="143" y="0" fill="#f59e0b" font-size="17" font-weight="800" class="font-sans wave-char w4">W</text>
    </g>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">Phase-staggered sinusoidal bounce</text>
  </g>

  <!-- Module 6: Terminal Typewriter & Cursor -->
  <g transform="translate(648, 205)">
    <rect width="280" height="105" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="#818cf8" />
    <text x="26" y="18" fill="#a5b4fc" font-size="10" font-weight="700" class="font-mono">EFFECT 06 // TERMINAL TYPEWRITER</text>
    <g transform="translate(32, 58)">
      <text x="0" y="0" fill="#e2e8f0" font-size="14.5" font-weight="700" class="font-mono">$ monoforge dev</text>
      <rect x="172" y="-13" width="9" height="16" fill="#38bdf8" class="cursor-blink" />
    </g>
    <text x="140" y="84" text-anchor="middle" fill="#64748b" font-size="10.5" class="font-mono">Typewriter cadence with square cursor</text>
  </g>

</svg>
