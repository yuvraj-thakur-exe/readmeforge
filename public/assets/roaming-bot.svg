<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cyberFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="botCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Roaming Bot Kinematics */
    @keyframes roamPath {
      0%   { transform: translate(70px, 0px); }
      35%  { transform: translate(380px, -6px); }
      50%  { transform: translate(520px, 2px); }
      75%  { transform: translate(320px, -4px); }
      100% { transform: translate(70px, 0px); }
    }

    @keyframes botHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-5px) rotate(2deg); }
      75%      { transform: translateY(3px) rotate(-2deg); }
    }

    @keyframes thrusterFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
      50%      { transform: scaleY(1.4) scaleX(0.85); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }

    @keyframes antennaBlink {
      0%, 100% { fill: #f43f5e; filter: drop-shadow(0 0 2px #f43f5e); }
      50%      { fill: #22d3ee; filter: drop-shadow(0 0 6px #22d3ee); }
    }

    /* Roaming Walking Dev */
    @keyframes roamDev {
      0%   { transform: translate(720px, 0px) scaleX(-1); }
      45%  { transform: translate(460px, 0px) scaleX(-1); }
      50%  { transform: translate(460px, 0px) scaleX(1); }
      95%  { transform: translate(720px, 0px) scaleX(1); }
      100% { transform: translate(720px, 0px) scaleX(-1); }
    }

    @keyframes legSwingL {
      0%, 100% { transform: rotate(-18deg); }
      50%      { transform: rotate(18deg); }
    }

    @keyframes legSwingR {
      0%, 100% { transform: rotate(18deg); }
      50%      { transform: rotate(-18deg); }
    }

    /* Chat Messages Cycling */
    @keyframes msgCycle1 {
      0%, 22%   { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes msgCycle2 {
      0%, 24%   { opacity: 0; transform: translateY(4px); }
      27%, 48%  { opacity: 1; transform: translateY(0); }
      51%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes msgCycle3 {
      0%, 50%   { opacity: 0; transform: translateY(4px); }
      53%, 73%  { opacity: 1; transform: translateY(0); }
      76%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes msgCycle4 {
      0%, 75%   { opacity: 0; transform: translateY(4px); }
      78%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; transform: translateY(-4px); }
    }

    /* Ambient Circuit Sparks */
    @keyframes sparkFloat {
      0%   { transform: translateY(0) scale(0.8); opacity: 0; }
      50%  { opacity: 0.8; }
      100% { transform: translateY(-24px) scale(1.2); opacity: 0; }
    }

    .roaming-bot-group {
      animation: roamPath 18s ease-in-out infinite;
    }

    .bot-hover-body {
      animation: botHover 3s ease-in-out infinite;
    }

    .bot-flame {
      transform-origin: center top;
      animation: thrusterFlicker 0.25s infinite alternate;
    }

    .beacon {
      animation: antennaBlink 1.2s infinite;
    }

    .roaming-dev-group {
      animation: roamDev 22s ease-in-out infinite;
    }

    .walk-l {
      transform-origin: 0px 0px;
      animation: legSwingL 0.6s infinite alternate ease-in-out;
    }

    .walk-r {
      transform-origin: 0px 0px;
      animation: legSwingR 0.6s infinite alternate ease-in-out;
    }

    .txt-msg1 { animation: msgCycle1 18s infinite; }
    .txt-msg2 { animation: msgCycle2 18s infinite; }
    .txt-msg3 { animation: msgCycle3 18s infinite; }
    .txt-msg4 { animation: msgCycle4 18s infinite; }

    .spark-1 { animation: sparkFloat 2.4s infinite ease-out; }
    .spark-2 { animation: sparkFloat 3.1s infinite 1.2s ease-out; }
    .spark-3 { animation: sparkFloat 2.8s infinite 0.7s ease-out; }
  </style>

  <!-- Background Base Container -->
  <rect width="880" height="160" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.2" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.18">
    <line x1="0" y1="40" x2="880" y2="40" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="6 4" />
    <line x1="0" y1="80" x2="880" y2="80" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="6 4" />
    <line x1="0" y1="120" x2="880" y2="120" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="6 4" />
    <!-- Vertical Perspective lines -->
    <line x1="120" y1="0" x2="90" y2="160" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="280" y1="0" x2="270" y2="160" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="440" y1="0" x2="440" y2="160" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="600" y1="0" x2="610" y2="160" stroke="#38bdf8" stroke-width="0.7" />
    <line x1="760" y1="0" x2="790" y2="160" stroke="#38bdf8" stroke-width="0.7" />
  </g>

  <!-- Ambient Rising Sparks -->
  <circle cx="210" cy="110" r="1.5" fill="#38bdf8" class="spark-1" />
  <circle cx="480" cy="100" r="2" fill="#a855f7" class="spark-2" />
  <circle cx="680" cy="115" r="1.5" fill="#22d3ee" class="spark-3" />

  <!-- Glowing Walkway Floor -->
  <line x1="40" y1="130" x2="840" y2="130" stroke="url(#cyberFloor)" stroke-width="3" filter="url(#neonGlow)" />
  <line x1="80" y1="132" x2="800" y2="132" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" />

  <!-- STATIONARY WORKSTATION / TERMINAL ON THE LEFT -->
  <g transform="translate(60, 85)">
    <!-- Terminal Pod Base -->
    <rect x="-16" y="24" width="32" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="-24" y="42" width="48" height="4" rx="2" fill="#334155" />
    <!-- Holographic Display Screen -->
    <rect x="-28" y="-18" width="56" height="38" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#neonGlow)" />
    <!-- Terminal Screen Header -->
    <rect x="-28" y="-18" width="56" height="8" rx="2" fill="#1e293b" />
    <circle cx="-22" cy="-14" r="1.5" fill="#ef4444" />
    <circle cx="-17" cy="-14" r="1.5" fill="#eab308" />
    <circle cx="-12" cy="-14" r="1.5" fill="#22c55e" />
    <!-- Code Lines on Terminal -->
    <line x1="-22" y1="-4" x2="-2" y2="-4" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-22" y1="3" x2="14" y2="3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-22" y1="10" x2="-8" y2="10" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
    <!-- Status Pill Badge -->
    <rect x="-26" y="27" width="52" height="7" rx="3.5" fill="#064e3b" />
    <text x="0" y="32.5" font-family="system-ui, sans-serif" font-size="5" font-weight="700" fill="#34d399" text-anchor="middle">ONLINE &bull; 535 TESTS</text>
  </g>

  <!-- 1. ROAMING AI CHATBOT (Moves along path, chats, blinks, floats) -->
  <g class="roaming-bot-group">
    <!-- Speech / Thought Bubble (Cycles Messages) -->
    <g transform="translate(0, 42)">
      <!-- Bubble Container -->
      <rect x="24" y="-36" width="220" height="34" rx="7" fill="url(#bubbleGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#neonGlow)" />
      <!-- Pointer Tail -->
      <path d="M 24 -14 L 14 -10 L 24 -8 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Message 1 -->
      <g class="txt-msg1">
        <text x="36" y="-22" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">🤖 ReadmeBot Assistant</text>
        <text x="36" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#e2e8f0">Analyzing profile... Generating custom charts!</text>
      </g>

      <!-- Message 2 -->
      <g class="txt-msg2">
        <text x="36" y="-22" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#a855f7">⚡ Role-Tailored Profiles</text>
        <text x="36" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#e2e8f0">Personalized per engineer — never generic!</text>
      </g>

      <!-- Message 3 -->
      <g class="txt-msg3">
        <text x="36" y="-22" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#34d399">📊 Dynamic Charts &amp; Graphs</text>
        <text x="36" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#e2e8f0">Languages Donut + Annual Commit Velocity</text>
      </g>

      <!-- Message 4 -->
      <g class="txt-msg4">
        <text x="36" y="-22" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f43f5e">🚀 Safe GitHub Sync</text>
        <text x="36" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#e2e8f0">Side-by-side diff preview before pushing!</text>
      </g>
    </g>

    <!-- Bot Physical Body with Bobber -->
    <g transform="translate(0, 95)" class="bot-hover-body">
      <!-- Antenna -->
      <line x1="0" y1="-28" x2="0" y2="-36" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="0" cy="-37" r="3" class="beacon" />

      <!-- Head Dome -->
      <ellipse cx="0" cy="-20" rx="14" ry="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />

      <!-- Visor & Eyes -->
      <rect x="-10" y="-24" width="20" height="7" rx="3.5" fill="#06b6d4" />
      <circle cx="-4" cy="-20.5" r="1.6" fill="#ffffff" />
      <circle cx="4" cy="-20.5" r="1.6" fill="#ffffff" />

      <!-- Chassis Body -->
      <rect x="-12" y="-9" width="24" height="20" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.6" />

      <!-- Glowing Arc Reactor Core -->
      <circle cx="0" cy="1" r="4.5" fill="url(#botCoreGrad)" filter="url(#coreGlow)" />
      <circle cx="0" cy="1" r="2" fill="#ffffff" />

      <!-- Robotic Gripper Arms -->
      <path d="M -12 -3 Q -20 2 -14 9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="-14" cy="9" r="2" fill="#38bdf8" />

      <path d="M 12 -3 Q 20 2 14 9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="14" cy="9" r="2" fill="#38bdf8" />

      <!-- Hover Thruster Exhaust & Flame -->
      <path d="M -6 11 L 6 11 L 3 15 L -3 15 Z" fill="#475569" />
      <ellipse cx="0" cy="20" rx="6" ry="4" fill="#38bdf8" class="bot-flame" />
      <ellipse cx="0" cy="21" rx="3" ry="2" fill="#ffffff" class="bot-flame" />
    </g>
  </g>

  <!-- 2. ROAMING PIXEL DEVELOPER CHARACTER (Walks and explores) -->
  <g class="roaming-dev-group">
    <g transform="translate(0, 114)">
      <!-- Left Leg -->
      <g class="walk-l">
        <rect x="-6" y="0" width="4" height="15" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <rect x="-8" y="12" width="6" height="3" rx="1.5" fill="#6366f1" />
      </g>
      <!-- Right Leg -->
      <g class="walk-r">
        <rect x="2" y="0" width="4" height="15" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <rect x="2" y="12" width="6" height="3" rx="1.5" fill="#6366f1" />
      </g>

      <!-- Hoodie Body -->
      <rect x="-10" y="-19" width="20" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.4" />
      <!-- Code Chest Monogram < / > -->
      <path d="M -4 -10 L -7 -7 L -4 -4 M 4 -10 L 7 -7 L 4 -4" stroke="#a5b4fc" stroke-width="1.3" fill="none" stroke-linecap="round" />

      <!-- Arms holding portable cyber tablet -->
      <rect x="-12" y="-14" width="4" height="12" rx="2" fill="#475569" />
      <rect x="8" y="-14" width="4" height="12" rx="2" fill="#475569" />
      <!-- Cyber Tablet -->
      <rect x="-8" y="-7" width="16" height="11" rx="2" fill="#0f172a" stroke="#22d3ee" stroke-width="1" />
      <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#22d3ee" stroke-width="1" />
      <line x1="-5" y1="0" x2="2" y2="0" stroke="#38bdf8" stroke-width="1" />

      <!-- Head / Hair / Headphones -->
      <path d="M -10 -34 C -10 -42 10 -42 10 -34" fill="none" stroke="#38bdf8" stroke-width="2.2" />
      <rect x="-12" y="-34" width="3.5" height="9" rx="1.5" fill="#38bdf8" />
      <rect x="8.5" y="-34" width="3.5" height="9" rx="1.5" fill="#38bdf8" />
      <!-- Head Block -->
      <rect x="-9" y="-36" width="18" height="17" rx="3.5" fill="#334155" />
      <!-- Face -->
      <rect x="-7" y="-32" width="14" height="10" rx="2" fill="#fed7aa" />
      <!-- Cyber Glasses / Visor -->
      <rect x="-6" y="-30" width="12" height="4" rx="1" fill="#00f5d4" />
    </g>
  </g>

  <!-- Title / Live Badge in Top Right -->
  <g transform="translate(860, 20)">
    <rect x="-240" y="0" width="225" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.9" />
    <circle cx="-224" cy="13" r="4" fill="#22c55e" filter="url(#coreGlow)" />
    <text x="-212" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">
      MonoForge Live Studio Active
    </text>
  </g>
</svg>
