<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c111a" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    @keyframes crtScan {
      0% { transform: translateY(0); }
      100% { transform: translateY(180px); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveFlicker {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }
    .scanline {
      animation: crtScan 4s linear infinite;
    }
    .cursor {
      animation: cursorBlink 1s infinite;
    }
    .flicker {
      animation: waveFlicker 2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .scanline, .cursor, .flicker { animation: none !important; }
    }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="320" rx="20" fill="url(#hud-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Accents -->
  <g opacity="0.06" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="80" x2="920" y2="80" />
    <line x1="0" y1="160" x2="920" y2="160" />
    <line x1="0" y1="240" x2="920" y2="240" />
    <line x1="230" y1="0" x2="230" y2="320" />
    <line x1="460" y1="0" x2="460" y2="320" />
    <line x1="690" y1="0" x2="690" y2="320" />
  </g>

  <!-- Header Status Bar -->
  <g transform="translate(28, 20)">
    <circle cx="10" cy="12" r="5" fill="#10b981" />
    <text x="24" y="16" fill="#f8fafc" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="bold">NOMONKEY.WORK // WORKSTATION HUD</text>
    <rect x="360" y="2" width="160" height="22" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="372" y="17" fill="#f59e0b" font-family="'SF Mono', monospace" font-size="10" font-weight="bold">ZERO MONKEY BIZ</text>

    <!-- Camo Proxy Tag -->
    <rect x="730" y="2" width="134" height="22" rx="6" fill="#111827" stroke="#10b981" stroke-width="1" />
    <text x="742" y="17" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="bold">100% CAMO SAFE</text>
  </g>

  <!-- LEFT: Cyber Monkey Developer Profile Silhouette -->
  <g transform="translate(28, 64)">
    <rect x="0" y="0" width="220" height="226" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />

    <!-- Monkey Avatar Icon -->
    <!-- Head -->
    <ellipse cx="110" cy="95" rx="55" ry="52" fill="#2a221b" stroke="#191410" stroke-width="2" />
    <!-- Ears -->
    <ellipse cx="60" cy="95" rx="22" ry="25" fill="#2a221b" />
    <ellipse cx="62" cy="95" rx="14" ry="17" fill="#d49f76" />
    <ellipse cx="160" cy="95" rx="22" ry="25" fill="#2a221b" />
    <ellipse cx="158" cy="95" rx="14" ry="17" fill="#d49f76" />
    <!-- Face -->
    <ellipse cx="110" cy="120" rx="36" ry="24" fill="#d49f76" />
    <ellipse cx="104" cy="112" rx="3" ry="4" fill="#451a03" />
    <ellipse cx="116" cy="112" rx="3" ry="4" fill="#451a03" />
    <!-- Smirk -->
    <path d="M 98 128 Q 110 136 122 128" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    <!-- Big Eyes -->
    <ellipse cx="94" cy="88" rx="12" ry="14" fill="#ffffff" />
    <circle cx="95" cy="88" r="6" fill="#10b981" />
    <circle cx="96" cy="88" r="3" fill="#04070d" />
    <circle cx="93" cy="85" r="1.5" fill="#ffffff" />

    <ellipse cx="126" cy="88" rx="12" ry="14" fill="#ffffff" />
    <circle cx="127" cy="88" r="6" fill="#10b981" />
    <circle cx="128" cy="88" r="3" fill="#04070d" />
    <circle cx="125" cy="85" r="1.5" fill="#ffffff" />

    <!-- Cyber Visor Glass over Eyes -->
    <rect x="76" y="78" width="68" height="22" rx="4" fill="#06b6d4" opacity="0.4" />
    <rect x="76" y="78" width="68" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />

    <!-- DJ Headphones -->
    <path d="M 50 85 C 50 40, 170 40, 170 85" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" />
    <rect x="42" y="80" width="16" height="34" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1" />
    <rect x="162" y="80" width="16" height="34" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1" />

    <!-- Hoodie Shoulders -->
    <path d="M 55 165 C 40 185, 30 215, 25 224 L 195 224 C 190 215, 180 185, 165 165 Z" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <line x1="110" y1="165" x2="110" y2="224" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Mascot Tag -->
    <text x="110" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CYBER CHIMP</text>
    <text x="110" y="214" fill="#10b981" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">ONLINE &bull; 100% READY</text>
  </g>

  <!-- CENTER: CRT Terminal Workstation Screen -->
  <g transform="translate(268, 64)">
    <rect x="0" y="0" width="374" height="226" rx="14" fill="url(#screen-grad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Terminal Window Bar -->
    <rect x="0" y="0" width="374" height="28" rx="14" fill="#0b0f19" />
    <line x1="0" y1="28" x2="374" y2="28" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#ef4444" />
    <circle cx="28" cy="14" r="4" fill="#f59e0b" />
    <circle cx="40" cy="14" r="4" fill="#10b981" />
    <text x="60" y="18" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10">bash - MonoForge Telemetry Shell</text>

    <!-- Scanline Glow Overlay -->
    <rect x="1" y="29" width="372" height="195" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" />
    <line x1="1" y1="35" x2="373" y2="35" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="scanline" />

    <!-- Code Output Stream -->
    <g transform="translate(16, 50)" font-family="'SF Mono', 'Fira Code', monospace" font-size="11">
      <text x="0" y="0" fill="#94a3b8">$ monoforge generate --profile</text>
      <text x="0" y="18" fill="#38bdf8">[INFO] Architecture: Poulo &bull; Marco Madonna &bull; NoMonkey</text>
      <text x="0" y="36" fill="#10b981">✓ Telemetry engine loaded: 47+ plugins</text>
      <text x="0" y="54" fill="#10b981">✓ 3D isometric commit landscape ready</text>
      <text x="0" y="72" fill="#10b981">✓ Languages donut &amp; habits radar generated</text>
      <text x="0" y="90" fill="#f59e0b">✓ S-Tier achievements rack validated</text>
      <text x="0" y="110" fill="#f8fafc">
        $ git commit -m "clean craft"<tspan class="cursor" fill="#f59e0b">█</tspan>
      </text>

      <!-- Mini Live Metric Badges -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="105" height="24" rx="6" fill="#1e293b" />
        <text x="10" y="16" fill="#34d399" font-size="9" font-weight="bold">STREAK: 182d</text>

        <rect x="115" y="0" width="105" height="24" rx="6" fill="#1e293b" />
        <text x="125" y="16" fill="#38bdf8" font-size="9" font-weight="bold">COMMITS: 2,490</text>

        <rect x="230" y="0" width="110" height="24" rx="6" fill="#1e293b" />
        <text x="240" y="16" fill="#fbbf24" font-size="9" font-weight="bold">SCORE: 100/100</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: 3D Isometric Mini Terrain & Equalizer -->
  <g transform="translate(662, 64)">
    <rect x="0" y="0" width="230" height="226" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="24" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10" font-weight="bold">COMMIT ELEVATION 3D</text>

    <!-- Isometric Voxel Terrain Mockup -->
    <g transform="translate(40, 50)">
      <!-- Voxel blocks -->
      <polygon points="40,20 60,10 80,20 60,30" fill="#10b981" />
      <polygon points="40,20 60,30 60,55 40,45" fill="#059669" />
      <polygon points="60,30 80,20 80,45 60,55" fill="#047857" />

      <polygon points="80,40 100,30 120,40 100,50" fill="#34d399" />
      <polygon points="80,40 100,50 100,75 80,65" fill="#10b981" />
      <polygon points="100,50 120,40 120,65 100,75" fill="#059669" />

      <polygon points="10,60 30,50 50,60 30,70" fill="#10b981" />
      <polygon points="10,60 30,70 30,95 10,85" fill="#059669" />
      <polygon points="30,70 50,60 50,85 30,95" fill="#047857" />

      <polygon points="50,80 70,70 90,80 70,90" fill="#f59e0b" />
      <polygon points="50,80 70,90 70,120 50,110" fill="#d97706" />
      <polygon points="70,90 90,80 90,110 70,120" fill="#b45309" />
    </g>

    <!-- Bottom Audio EQ & Status -->
    <g transform="translate(18, 185)">
      <text x="0" y="10" fill="#64748b" font-family="'SF Mono', monospace" font-size="9">AUDIO BEATS: Lofi Coding</text>
      <g transform="translate(0, 16)" fill="#38bdf8" class="flicker">
        <rect x="0" y="0" width="4" height="14" rx="2" />
        <rect x="8" y="-4" width="4" height="18" rx="2" />
        <rect x="16" y="2" width="4" height="12" rx="2" />
        <rect x="24" y="-8" width="4" height="22" rx="2" />
        <rect x="32" y="-2" width="4" height="16" rx="2" />
        <rect x="40" y="-12" width="4" height="26" rx="2" fill="#f59e0b" />
        <rect x="48" y="-6" width="4" height="20" rx="2" fill="#10b981" />
        <rect x="56" y="0" width="4" height="14" rx="2" />
        <rect x="64" y="-10" width="4" height="24" rx="2" fill="#10b981" />
        <rect x="72" y="-2" width="4" height="16" rx="2" />
        <rect x="80" y="4" width="4" height="10" rx="2" />
      </g>
    </g>
  </g>
</svg>

