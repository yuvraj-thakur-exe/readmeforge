<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="forgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  
  <!-- Base anvil shape -->
  <path d="M 20 68 L 80 68 L 74 78 L 26 78 Z" fill="url(#forgeGradient)" opacity="0.85" />
  <path d="M 30 78 L 70 78 L 76 86 L 24 86 Z" fill="url(#forgeGradient)" />
  <rect x="36" y="58" width="28" height="10" rx="2" fill="url(#forgeGradient)" opacity="0.9" />

  <!-- Rising forge flame -->
  <path d="M 50 14 C 44 26 34 32 34 46 C 34 58 42 64 50 64 C 58 64 66 58 66 46 C 66 38 60 28 50 14 Z" 
        fill="url(#forgeGradient)" filter="url(#glow)" />
  <!-- Inner core flame spark -->
  <path d="M 50 28 C 47 36 42 40 42 48 C 42 54 46 58 50 58 C 54 58 58 54 58 48 C 58 42 54 36 50 28 Z" 
        fill="#ffffff" opacity="0.85" />
  
  <!-- Sparks -->
  <circle cx="28" cy="30" r="2.5" fill="#06b6d4" opacity="0.9" />
  <circle cx="72" cy="34" r="2.5" fill="#8b5cf6" opacity="0.9" />
  <circle cx="50" cy="8" r="2" fill="#ffffff" />
</svg>
