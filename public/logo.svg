<svg width="520" height="130" viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .mono-wordmark {
        fill: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .mono-tagline {
        fill: #a1a1aa;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      @media (prefers-color-scheme: light) {
        .mono-wordmark { fill: #09090b; }
        .mono-tagline { fill: #52525b; }
      }
    </style>
  </defs>

  <!-- Left Icon: Hexagonal MonoForge Monkey in Obsidian Badge -->
  <rect x="10" y="10" width="110" height="110" rx="24" fill="#18181b" stroke="#27272a" stroke-width="2"/>

  <g transform="translate(15, 15) scale(0.1)" stroke="#f59e0b" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ear -->
    <path d="M 230 400 C 130 400 90 470 90 540 C 90 610 130 680 230 680" />
    <!-- Right Ear -->
    <path d="M 770 400 C 870 400 910 470 910 540 C 910 610 870 680 770 680" />
    <!-- Outer Hexagon -->
    <polygon points="340,160 660,160 840,380 840,680 660,880 340,880 160,680 160,380" fill="none" />
    <!-- Inner Facial Mask -->
    <path d="M 500 370 L 380 290 L 270 420 L 360 540 L 360 720 L 500 810 L 640 720 L 640 540 L 730 420 L 620 290 Z" fill="none" />
    <!-- Eyes -->
    <circle cx="400" cy="480" r="46" fill="#f59e0b" stroke="none" />
    <circle cx="600" cy="480" r="46" fill="#f59e0b" stroke="none" />
    <!-- Nose & Mouth -->
    <path d="M 430 525 L 500 585 L 570 525" />
    <line x1="500" y1="585" x2="500" y2="700" />
    <path d="M 410 730 L 500 700 L 590 730" />
  </g>

  <!-- Wordmark -->
  <text x="145" y="72" class="mono-wordmark">Mono<tspan fill="url(#monoGold)">Forge</tspan></text>
  <text x="148" y="100" class="mono-tagline">GITHUB PROFILE &amp; TELEMETRY STUDIO</text>
</svg>
