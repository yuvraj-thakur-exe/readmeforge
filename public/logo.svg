  <!-- wordmark -->
  <text x="150" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#0b0b12">Readme<tspan fill="url(#rf-grad)">Forge</tspan></text>
  <text x="150" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#6b7280">Forge a GitHub profile that gets noticed.</text>
